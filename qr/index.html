<body>
  <div class="qr-app">
    <header class="qr-top">
      <div class="qr-brand"><span class="qr-logo" aria-hidden="true"></span><h1>QR SLOP</h1></div>
      <div class="qr-tools">
        <button type="button" class="sui-btn" id="qr-cmd" aria-label="Commands (search every command)">Commands</button>
      </div>
    </header>

    <div class="qr-bar" role="toolbar" aria-label="View and output">
      <div class="qr-modes">
        <button type="button" class="sui-btn" id="qr-mode-single" aria-pressed="true">Single code</button>
        <button type="button" class="sui-btn" id="qr-mode-batch" aria-pressed="false">Batch</button>
      </div>
      <div class="qr-opts" id="qr-opts" aria-label="Output options"></div>
    </div>

    <main class="qr-single" id="qr-single">
      <section class="qr-panel" aria-label="Content">
        <div id="qr-typehost"></div>
        <div class="qr-form" id="qr-form"></div>
        <p class="qr-err" id="qr-err" role="alert"></p>
        <div class="qr-payload">
          <span class="qr-label">Encoded text</span>
          <pre class="qr-pre" id="qr-payload" aria-live="polite"></pre>
          <button type="button" class="sui-btn" id="qr-copy" disabled>Copy text</button>
        </div>
      </section>
      <section class="qr-panel qr-out" aria-label="Preview and download">
        <div class="qr-preview" id="qr-preview"></div>
        <div class="qr-actions">
          <button type="button" class="sui-btn sui-primary" id="qr-svg" disabled>Download SVG</button>
          <button type="button" class="sui-btn" id="qr-png" disabled>Download PNG</button>
        </div>
      </section>
    </main>

    <main class="qr-batch" id="qr-batch" hidden>
      <section class="qr-panel" aria-label="Batch input">
        <label class="qr-label" for="qr-batch-in">One text per line</label>
        <textarea class="sui-input qr-batch-in" id="qr-batch-in" rows="6" spellcheck="false" placeholder="https://example.com&#10;Ticket 0001&#10;Ticket 0002"></textarea>
        <div class="qr-actions">
          <button type="button" class="sui-btn sui-primary" id="qr-batch-go">Make codes</button>
          <span class="qr-note" id="qr-batch-note" role="status" aria-live="polite"></span>
        </div>
      </section>
      <div class="qr-grid" id="qr-grid"></div>
    </main>
  </div>
  <script src="../shared/tour/mount.js" data-app="qr"></script>
</body>
