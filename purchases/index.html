<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <a id="purAbout" href="about/">About</a>
      <button type="button" class="tb-btn" id="purCmd" data-cmd="cmd.palette" aria-label="Search commands" title="Search commands (Ctrl+K)">⌘K</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="Purchases sections">
      <button type="button" role="tab" class="tab" id="tab-list" data-view="list" aria-controls="view-list" aria-selected="true">Purchase orders</button>
      <button type="button" role="tab" class="tab" id="tab-edit" data-view="edit" aria-controls="view-edit" aria-selected="false" hidden>Purchase order</button>
      <button type="button" role="tab" class="tab" id="tab-data" data-view="data" aria-controls="view-data" aria-selected="false">Data</button>
    </nav>

    <main class="main" id="main">
      <span class="local-badge" title="Suppliers, purchase orders and stock stay in this browser. Nothing is uploaded."><span>100% local</span></span>
      <div id="boot" class="boot" role="status">Opening your purchase orders…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <label class="search"><span class="sr">Search purchase orders</span>
            <input id="pSearch" type="search" placeholder="Search number, supplier or notes" autocomplete="off" spellcheck="false"></label>
          <label>Status <select id="pStatus">
            <option value="all">All</option><option value="draft">Draft</option><option value="ordered">Ordered</option><option value="late">Late</option>
            <option value="received">Received</option><option value="unbilled">To bill</option><option value="cancelled">Cancelled</option>
          </select></label>
          <button type="button" class="btn primary" id="pNew">New purchase order</button>
        </div>
        <p class="note" id="pSummary" role="status"></p>
        <div class="table" id="pRows"></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="ws-stage">
        <div class="head-row">
          <button type="button" class="btn small" id="eBack">← Purchase orders</button>
          <h2 class="h2" id="eTitle">New purchase order</h2>
          <span class="chip" id="eStatus"></span>
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <div class="toolbar" id="eModes"></div>
        <div class="toolbar" id="eLayout"></div>
        <div id="ePage" class="page-wrap"></div>
        </div>
        <aside class="ws-panel" aria-label="Purchase order details">
        <form class="card" id="eForm" novalidate data-form-only>
          <div class="form-grid">
            <label class="wide">Supplier
              <span class="inline"><select id="eCustomer"></select><button type="button" class="btn" id="eNewCustomer">New supplier</button></span>
            </label>
            <label>Date <input id="eDate" type="date" required></label>
            <label>Expected <input id="eExpected" type="date"></label>
            <label>Currency <input id="eCurrency" type="text" readonly tabindex="-1"></label>
            <label class="wide">Notes <textarea id="eNotes" rows="2" maxlength="5000" placeholder="Delivery address, terms, contact"></textarea></label>
          </div>
        </form>
        <h2 class="h2" data-form-only>Lines</h2>
        <div id="eLines" class="lines" data-form-only></div>
        <div class="toolbar" data-form-only><button type="button" class="btn" id="eAddLine">Add line</button></div>
        <div class="card totals" id="eTotals" aria-live="polite" data-form-only></div>
        <p class="note" id="eLinks"></p>
        <div class="toolbar actions" id="eActions"></div>
        </aside>
      </section>

      <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden>
        <div class="card">
          <h2 class="h2">Full backup</h2>
          <p class="note">A backup holds every record in the shared business data for this browser: customers and suppliers, products, quotes, orders, purchase orders, invoices, payments, expenses, stock and the ledger.</p>
          <div class="toolbar"><button type="button" class="btn primary" id="dBackup">Download full backup</button></div>
          <label class="file">Restore from a backup file <input id="dRestore" type="file" accept="application/json,.json"></label>
          <ul class="report" id="dRestoreMsg" aria-live="polite"></ul>
        </div>
      </section>
    </main>
