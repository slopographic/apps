<!doctype html>
<html lang="en" data-theme="pro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SlopEdit — Slopographic</title>
  <meta name="description" content="SlopEdit: a free video editor that runs 100% in your browser. Multi-track timeline, trim, split, transitions, titles, colour and audio mixing, MP4 export with WebCodecs. Nothing is uploaded.">
  <meta name="theme-color" content="#0e0e10">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="canonical" href="https://slopographic.com/slopedit/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Slopographic">
  <meta property="og:title" content="SlopEdit — Slopographic">
  <meta property="og:description" content="A video editor that never uploads your footage: cut, trim, add titles and transitions, and export MP4 right in your browser.">
  <meta property="og:url" content="https://slopographic.com/slopedit/">
  <meta property="og:image" content="https://slopographic.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    try { var t = JSON.parse(localStorage.getItem('slopedit.theme')); if (t === 'light' || t === 'classic' || t === 'pro') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ }
  </script>
  <link rel="stylesheet" href="../shared/fonts/fonts.css" data-offline="strip">
  <link rel="stylesheet" href="../shared/slopui.css" data-src="shared/slopui.css">
  <link rel="stylesheet" href="../shared/commands/commands.css" data-src="shared/commands/commands.css">

</head>
<body>
  <div class="app" id="app" data-pane="media">
    <header class="topbar">
      <a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
      </a>
      <div class="appname"><b>SlopEdit</b><a class="home-link" href="../">slopographic</a></div>
      <nav class="menus" id="menus" aria-label="Main menu"></nav>
      <div class="tb-group">
        <button type="button" class="tb" id="btnUndo" aria-label="Undo" title="Undo" disabled></button>
        <button type="button" class="tb" id="btnRedo" aria-label="Redo" title="Redo" disabled></button>
        <button type="button" class="tb" id="btnSearch" aria-label="Search commands" title="Search commands (Ctrl+K)"></button>
      </div>
      <span class="tb-flex"></span>
      <span class="local-badge" title="Your footage is processed on this device. Nothing is uploaded."><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>100% local · nothing uploaded</span></span>
      <label class="fname"><span class="sr">Project name</span><input id="projName" type="text" value="Untitled project" spellcheck="false" autocomplete="off" aria-label="Project name"></label>
      <button type="button" class="btn primary" id="btnExport"></button>
      <button type="button" class="tb" id="btnMore" aria-label="Menu" title="Menu"></button>
    </header>

    <aside class="pane bin" id="bin" aria-label="Project media and effects"></aside>

    <main class="monitor" id="monitor" aria-label="Program monitor">
      <div class="mon-stage" id="monStage" tabindex="0" aria-label="Program monitor. Shift+F10 opens its menu">
        <canvas id="preview" width="1280" height="720" aria-label="Preview"></canvas>
        <canvas id="overlay" class="mon-overlay" width="1280" height="720" aria-hidden="true"></canvas>
        <div class="mon-msg" id="monMsg" hidden></div>
      </div>
      <div class="transport" id="transport" role="toolbar" aria-label="Playback"></div>
    </main>

    <aside class="pane insp" id="insp" aria-label="Inspector"></aside>

    <section class="timeline" id="timeline" aria-label="Timeline">
      <div class="tl-split" id="tlSplit" title="Drag to resize" aria-hidden="true"></div>
      <div class="tl-bar" id="tlBar" role="toolbar" aria-label="Timeline tools"></div>
      <div class="tl-body" id="tlBody">
        <div class="tl-heads" id="tlHeads"></div>
        <div class="tl-lanes" id="tlLanes" tabindex="0" aria-label="Timeline tracks. Space plays, S splits, arrows step frames.">
          <canvas id="tlCanvas" tabindex="0" aria-label="Timeline. Shift+F10 opens the menu for the selected clip"></canvas>
        </div>
      </div>
    </section>

    <nav class="mtabs" id="mtabs" aria-label="Panels"></nav>
    <footer class="statusbar" id="status">
      <span id="statusLeft">Ready</span>
      <span id="statusMsg" class="st-msg" aria-live="polite"></span>
      <span class="tb-flex"></span>
      <span id="statusCaps"></span>
      <span class="st-local"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Local only</span>
    </footer>
  </div>
  <div class="drop-overlay" id="dropOverlay" hidden><div><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg><b>Drop to import</b><span>Video, audio and images · processed locally</span></div></div>
  <noscript><p class="noscript">SlopEdit needs JavaScript. It runs entirely in your browser — nothing is uploaded.</p></noscript>
