<body>
  <div class="smb-hold" hidden>
    <span class="local-badge" title="Your photos are sorted in this browser. Nothing is uploaded or kept after you close the page."><span>100% local</span></span>
  </div>
  <main class="so-app">
    <section class="so-intro">
      <h1>Sort photos: keep the best</h1>
      <p class="so-lede">Drop a pile of photos or a whole folder, then swipe through them one at a time: like, dislike or tag each one with the arrow keys or the buttons. Download the keepers as a ZIP, or put them in Slop Drive.</p>
    </section>
    <div class="so-add">
      <div id="soDrop" class="so-drop"></div>
      <input id="soPick" type="file" accept="image/*" multiple hidden>
      <div class="so-or"><button type="button" class="so-btn" id="soFolder">Choose a folder…</button><input id="soDir" type="file" webkitdirectory multiple hidden>
</div>
    </div>
    <p id="soMsg" class="so-msg" role="status" aria-live="polite"></p>
    <section id="soWork" class="so-work" hidden aria-label="Your photos">
      <div class="so-bar">
        <button type="button" class="so-btn primary" id="soStart">Start sorting</button>
        <div id="soFilters" class="so-filters" role="group" aria-label="Show"></div>
      </div>
      <ul id="soGrid" class="so-grid" aria-label="Photos"></ul>
      <p id="soNone" class="so-none" hidden>No photos in this view.</p>
      <div class="so-bar so-out">
        <button type="button" class="so-btn primary" id="soZip">Download liked (ZIP)</button>
        <button type="button" class="so-btn" id="soDrive">Save liked to Slop Drive</button>
        <button type="button" class="so-btn" id="soCsv">Download the list (CSV)</button>
        <button type="button" class="so-btn" id="soClear">Clear</button>
      </div>
    </section>
  </main>
  <script src="../shared/slopui.js"></script>

  <script src="../shared/menubar/menubar.js"></script>
  <script>SlopMenuBar.mount({ "app": "Photo Sorter", "menus": { "File": ["#soFolder", "-", "#soZip", "#soDrive", "#soCsv", "-", "#soClear"], "Sort": ["#soStart"] } });</script>

<i id="slop-built" hidden></i>
