  <div class="app" id="app">
    <header class="topbar">
      <a class="logo" href="../" title="Back to slopographic.com" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
        <span class="logo-word">PhotoSlop</span>
      </a>
      <nav class="menubar" id="menubar" aria-label="Menu"></nav>
      <div class="doc-title" id="docTitle">Untitled</div>
      <div class="top-actions">
        <button class="top-btn" id="themeToggle" type="button" title="Switch theme: Pro, Light, Paint ’98" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.8-.7-1.3-1.5-1.1A5 5 0 0 1 13.1 4.5C13.3 3.7 12.8 3 12 3z"/></svg>
        </button>
        <button class="top-btn" id="cmdBtn" type="button" title="Search commands" aria-label="Search commands" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="top-btn export" id="exportBtn" type="button" title="Export As… (Alt+Shift+Ctrl+W)">Export</button>
        <button class="top-btn panel-toggle" id="panelToggle" type="button" aria-expanded="false" aria-controls="panels">Layers</button>
      </div>
    </header>
    <div class="options" id="options" role="toolbar" aria-label="Tool options"></div>
    <div class="main">
      <aside class="toolbox" id="toolbox" aria-label="Tools"></aside>
      <div class="docarea">
        <div class="tabs" id="tabs" role="tablist" aria-label="Open documents"></div>
        <div class="viewport" id="viewport">
          <div class="ps-dropstrip" id="psDrop"></div>
          <canvas id="view" aria-label="Image canvas"></canvas>
        </div>
        <div class="drop-zones" aria-hidden="true">
          <div class="dz dz-open" data-zone="open"><b>Open as new tabs</b><span>PSD, PNG, JPEG, WebP, GIF, SVG, TIFF, BMP, AVIF, ORA, KRA…</span></div>
          <div class="dz dz-place" data-zone="place"><b>Place as layers</b><span>into <em class="dz-doc">this document</em></span></div>
        </div>
      </div>
      <aside class="panels" id="panels" aria-label="Panels"></aside>
    </div>
    <footer class="status" id="status" aria-label="Status"></footer>
  </div>
  <input type="file" id="fileIn" multiple hidden>
  <noscript><p class="noscript">PhotoSlop needs JavaScript to run. Nothing is uploaded: it all runs on your device.</p></noscript>
