<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <button type="button" class="tb-btn" id="xMenuNew" data-cmd="expenses.new">New expense</button>
      <button type="button" class="tb-btn" id="xMenuCsv" data-cmd="expenses.csv">Download CSV</button>
      <a id="xAbout" href="about/">About</a>
      <button type="button" class="tb-btn" id="xCmd" data-cmd="cmd.palette" aria-label="Search commands" title="Search commands (Ctrl+K)">⌘K</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="Expenses sections">
      <button type="button" role="tab" class="tab" id="tab-list" data-view="list" aria-controls="view-list" aria-selected="true">Expenses</button>
      <button type="button" role="tab" class="tab" id="tab-edit" data-view="edit" aria-controls="view-edit" aria-selected="false" hidden>Expense</button>
      <button type="button" role="tab" class="tab" id="tab-summary" data-view="summary" aria-controls="view-summary" aria-selected="false">Summary</button>
    </nav>

    <main class="main" id="main">
      <span class="local-badge" title="Expenses and the books stay in this browser. Nothing is uploaded."><span>100% local</span></span>
      <div id="boot" class="boot" role="status">Opening your expenses…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <label class="search"><span class="sr">Search expenses</span>
            <input id="xSearch" type="search" placeholder="Search supplier, description or notes" autocomplete="off" spellcheck="false"></label>
          <label>Period <select id="xPeriod">
            <option value="all">All dates</option><option value="month">This month</option><option value="last">Last month</option><option value="year">This year</option>
          </select></label>
          <label>Status <select id="xStatus"><option value="all">All</option><option value="posted">Recorded</option><option value="owed">To pay</option><option value="void">Void</option></select></label>
          <button type="button" class="btn primary" id="xNew">New expense</button>
          <button type="button" class="btn" id="xMileage">Mileage…</button>
        </div>
        <div class="toolbar"><p class="note" id="xSummary" role="status"></p><span class="total" id="xTotal"></span></div>
        <div class="table" id="xRows"></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="head-row">
          <button type="button" class="btn small" id="eBack">← Expenses</button>
          <h2 class="h2" id="eTitle">New expense</h2>
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <form class="card" id="eForm" novalidate>
          <div class="toolbar receipt-row"><button type="button" class="btn" id="eReceipt">From a receipt…</button><span class="note">Take or choose a photo of the receipt: it is read on this device and kept in Slop Drive.</span>
            <input id="eReceiptPick" type="file" accept="image/*" hidden></div>
          <div class="form-grid">
            <label>Date <input id="eDate" type="date" required></label>
            <label>Supplier <input id="eSupplier" list="eSuppliers" maxlength="200" required autocomplete="off"></label>
            <datalist id="eSuppliers"></datalist>
            <label class="wide">Description <input id="eDescription" maxlength="300" placeholder="What it was for"></label>
            <label>Category <select id="eAccount"></select></label>
            <label>Paid by <select id="eMethod"><option value="bank">Bank transfer</option><option value="card">Card</option><option value="cash">Cash</option><option value="other">Other</option><option value="later">Not paid yet: a bill to pay</option></select></label>
            <label id="eDueRow" hidden>Due date <input id="eDue" type="date"></label>
            <label>Amount paid (tax included) <input id="eAmount" inputmode="decimal" placeholder="24.00" required></label>
            <label>Currency <input id="eCurrency" maxlength="3" autocomplete="off" spellcheck="false"></label>
            <label>Tax rate % <input id="eRate" type="number" min="0" max="100" step="0.01" inputmode="decimal"></label>
            <label>Tax to reclaim <input id="eTax" inputmode="decimal" placeholder="0.00"></label>
            <label class="wide">Notes <textarea id="eNotes" rows="2" maxlength="5000"></textarea></label>
          </div>
        </form>
        <div class="card" id="eView" hidden></div>
        <div class="toolbar actions">
          <button type="button" class="btn primary" id="eRecord">Record expense</button>
          <button type="button" class="btn" id="eCopy" hidden>Record a copy</button>
          <button type="button" class="btn primary" id="ePay" hidden>Mark as paid…</button>
          <button type="button" class="btn danger" id="eVoid" hidden>Void…</button>
        </div>
      </section>

      <section class="view" id="view-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
        <div class="stats" id="sStats"></div>
        <div class="card table-wrap">
          <table class="months"><caption class="sr">Expenses by month</caption>
            <thead><tr><th scope="col">Month</th><th scope="col" class="num">Expenses</th><th scope="col" class="num">Total</th><th scope="col" class="num">Tax</th><th scope="col">Biggest categories</th></tr></thead>
            <tbody id="sMonths"></tbody>
          </table>
          <p class="note" id="sEmpty" hidden>Nothing recorded yet.</p>
          <p class="note" id="sOther"></p>
        </div>
        <div class="toolbar"><button type="button" class="btn" id="sCsv">Download CSV of every expense</button></div>
      </section>
    </main>
