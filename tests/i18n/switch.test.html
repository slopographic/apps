<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Language switch across pages</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; } iframe { width: 1000px; height: 700px; border: 0; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, beforeEach, afterEach, expect, sleep, waitFor, run } = SlopTest;
  // Pages open in iframes of this origin, so they share localStorage (the profile). Each test starts with none.
  const frames = [];
  function open(src) {
    const f = document.createElement('iframe');
    f.src = src;
    document.body.append(f);
    frames.push(f);
    return waitFor(() => f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow.SlopI18n && f.contentDocument.querySelector('[data-i18n="nav.apps"]'), { timeout: 20000 }).then(() => f);
  }
  const navText = (f) => f.contentDocument.querySelector('[data-i18n="nav.apps"]').textContent;
  const stored = () => { try { return JSON.parse(localStorage.getItem('slop-profile') || 'null'); } catch (e) { return null; } };
  /** Chooses a language in the Settings picker, the way a visitor does. */
  async function choose(code) {
    const s = await open('../../settings/index.html');
    const sel = s.contentDocument.getElementById('lang-select');
    sel.value = code;
    sel.dispatchEvent(new s.contentWindow.Event('change'));
    return s;
  }

  describe('language across the site', () => {
    beforeEach(() => { localStorage.clear(); });
    afterEach(() => { frames.splice(0).forEach((f) => f.remove()); localStorage.clear(); });

    it('the Settings picker lists every language, English first', async () => {
      const s = await open('../../settings/index.html');
      const values = [...s.contentDocument.getElementById('lang-select').options].map((o) => o.value);
      expect(values).toEqual(['en', 'es', 'fr', 'de', 'pt-BR', 'it', 'ar', 'sv']);
    });

    it('choosing Spanish changes the homepage nav text, and it persists across a reload', async () => {
      const home = await open('../../index.html');
      expect(navText(home)).toBe('Apps');
      await choose('es');
      const h = await open('../../index.html');
      expect(navText(h)).toBe('Aplicaciones');
      expect(h.contentDocument.documentElement.getAttribute('lang')).toBe('es');
      expect(stored().data.lang.mode).toBe('es');
      // Reload the homepage: the stored choice is read again at boot.
      const loaded = new Promise((r) => h.addEventListener('load', r, { once: true }));
      h.contentWindow.location.reload();
      await loaded;
      await waitFor(() => h.contentDocument && h.contentDocument.querySelector('[data-i18n="nav.apps"]') && navText(h) === 'Aplicaciones', { timeout: 20000 });
      expect(navText(h)).toBe('Aplicaciones');
      expect(h.contentDocument.documentElement.getAttribute('lang')).toBe('es');
    });

    it('a page that loads only the shell also shows the chosen language at boot', async () => {
      localStorage.setItem('slop-profile', JSON.stringify({ v: 1, data: { lang: { mode: 'es' } } }));
      const page = await open('../../ledger/index.html');
      const btn = await waitFor(() => page.contentDocument.querySelector('.sh-switch .sh-hbtn-txt'), { timeout: 20000 });
      expect(btn.textContent).toBe('Aplicaciones');
      expect(page.contentDocument.documentElement.getAttribute('lang')).toBe('es');
    });

    it('switching back to English restores the English nav text', async () => {
      await choose('es');
      await choose('en');
      const h = await open('../../index.html');
      expect(navText(h)).toBe('Apps');
      expect(stored().data.lang).toBeFalsy(); // English is the default, so the override is cleared
    });
  });
  run({ name: 'Language switch across pages' });
  </script>
</body>
</html>
