<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Convert: the convert dialog</title></head>
<body>
<script src="../harness.js"></script>
<script src="../../vendor/pdf-lib/pdf-lib.min.js"></script>
<script type="module">
import { open } from '../../shared/convert/dialog.js';
const { describe, it, expect, waitFor } = SlopTest;

/** A one-page PDF with the words "Convert me" (pdf-lib, the vendored build). */
async function samplePdf(text = 'Convert me') {
  const doc = await PDFLib.PDFDocument.create();
  const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  doc.addPage([300, 200]).drawText(text, { x: 20, y: 90, size: 24, font });
  return new File([await doc.save()], 'sample.pdf', { type: 'application/pdf' });
}

describe('Convert dialog', () => {
  it('lists the conversions a PDF can take, and no image or CSV ones', async () => {
    const ctl = open({ file: await samplePdf() });
    await ctl.ready;
    const ids = ctl.targets();
    for (const id of ['pdf-to-png', 'pdf-to-jpg', 'pdf-to-text', 'split-pdf']) expect(ids.includes(id)).toBe(true);
    for (const id of ['to-png', 'images-to-pdf', 'csv-to-json', 'merge-pdf']) expect(ids.includes(id)).toBe(false);
    const radios = [...ctl.element.querySelectorAll('input[name]')].map((i) => i.dataset.target);
    expect(radios).toEqual(ids);
    expect(ctl.element.querySelector('[data-k="dr:0"]')).toBe(null); // no Drive link: no Save to Slop Drive
    ctl.close();
    expect(document.querySelector('.sl-cvt-dlg')).toBe(null);
  });

  it('runs one conversion to PNG and gives the page as a PNG file', async () => {
    const ctl = open({ file: await samplePdf() });
    await ctl.ready;
    ctl.element.querySelector('input[data-target="pdf-to-png"]').click();
    ctl.element.querySelector('[data-k="run"]').click();
    await waitFor(() => ctl.results().length === 1, { timeout: 60000 });
    const [out] = ctl.results();
    expect(out.name).toBe('sample-page-1.png');
    expect(out.blob.type).toBe('image/png');
    const sig = new Uint8Array(await out.blob.slice(0, 4).arrayBuffer());
    expect(Array.from(sig)).toEqual([0x89, 0x50, 0x4e, 0x47]);
    expect(!!ctl.element.querySelector('[data-k="dl:0"]')).toBe(true);
    ctl.close();
  }, { timeout: 90000 });

  it('lets the person add a file that is not open: a second PDF makes Merge PDFs possible', async () => {
    const ctl = open({ file: await samplePdf('First') });
    await ctl.ready;
    expect(ctl.targets().includes('merge-pdf')).toBe(false);
    const picker = ctl.element.querySelector('input[type=file]');
    const dt = new DataTransfer();
    dt.items.add(await samplePdf('Second'));
    picker.files = dt.files;
    picker.dispatchEvent(new Event('change'));
    await waitFor(() => ctl.targets().includes('merge-pdf'));
    ctl.element.querySelector('input[data-target="merge-pdf"]').click();
    ctl.element.querySelector('[data-k="run"]').click();
    await waitFor(() => ctl.results().length === 1, { timeout: 60000 });
    const [out] = ctl.results();
    expect(out.name).toBe('merged.pdf');
    expect((await out.blob.text()).startsWith('%PDF-')).toBe(true);
    ctl.close();
  }, { timeout: 90000 });

  it('runs PDF to text and gives the words of the page', async () => {
    const ctl = open({ file: await samplePdf('Plain words here') });
    await ctl.ready;
    ctl.element.querySelector('input[data-target="pdf-to-text"]').click();
    ctl.element.querySelector('[data-k="run"]').click();
    await waitFor(() => ctl.results().length === 1, { timeout: 60000 });
    const [out] = ctl.results();
    expect(out.name).toBe('sample.txt');
    expect((await out.blob.text()).includes('Plain words here')).toBe(true);
    ctl.close();
  }, { timeout: 90000 });
});

SlopTest.run({ name: 'Slop Convert dialog' });
</script>
</body>
</html>
