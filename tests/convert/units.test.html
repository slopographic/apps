<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Convert: units</title></head>
<body>
<script src="../harness.js"></script>
<script type="module">
import { convert, parseDecimal, formatDecimal, categories } from '../../convert/js/core/units.js';
const { describe, it, expect } = SlopTest;

describe('exact unit conversion', () => {
  const ex = (cat, from, to, v) => { const r = convert(cat, from, to, v); return { text: r.text, exact: r.exact }; };
  it('gives exact decimal answers where they terminate', () => {
    expect(ex('length', 'mi', 'km', '1')).toEqual({ text: '1.609344', exact: true });
    expect(ex('length', 'ft', 'm', '1')).toEqual({ text: '0.3048', exact: true });
    expect(ex('weight', 'lb', 'kg', '1')).toEqual({ text: '0.45359237', exact: true });
    expect(ex('data', 'GB', 'MiB', '1')).toEqual({ text: '953.67431640625', exact: true });
    expect(ex('data', 'KB', 'B', '0.1')).toEqual({ text: '100', exact: true });
    expect(ex('time', 'd', 'h', '1.5')).toEqual({ text: '36', exact: true });
  });
  it('converts temperatures through kelvin', () => {
    expect(ex('temperature', 'C', 'F', '100').text).toBe('212');
    expect(ex('temperature', 'F', 'C', '-40').text).toBe('-40');
    expect(ex('temperature', 'K', 'C', '0').text).toBe('-273.15');
  });
  it('flags non-terminating answers as approximate and rounds them', () => {
    const r = ex('length', 'm', 'ft', '1');
    expect(r.exact).toBeFalsy();
    expect(r.text).toBe('3.280839895013');
  });
  it('parses decimals and exponents exactly', () => {
    expect(formatDecimal(parseDecimal('1.25e2'))).toEqual({ text: '125', exact: true });
    expect(formatDecimal(parseDecimal('-0.5'))).toEqual({ text: '-0.5', exact: true });
    expect(() => parseDecimal('abc')).toThrow(/not a number/);
  });
  it('lists every category with units', () => {
    const keys = categories().map((c) => c.key);
    expect(keys).toEqual(['length', 'weight', 'time', 'data', 'temperature']);
  });
});

SlopTest.run({ name: 'Slop Convert: units' });
</script>
</body>
</html>
