<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>File convert: the Convert to picker (format tiles in groups), the arrow keys, and the flow picture's ▾ tile</title>
  <style>body { margin: 0; } iframe { width: 1280px; height: 860px; border: 0; }</style>
</head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script>
  // Covers: convert/js/ui/target-picker.js, convert/js/ui/markup.js, convert/js/ui/tool.js, convert/css/convert.css, shared/ui/flow.js
  const { describe, it, expect, waitFor } = SlopTest;
  let W, D, T;
  const $ = (s) => D.querySelector(s);
  const picks = () => [...D.querySelectorAll('#cv-picker .cv-pick')];
  describe('File convert: picking the format', () => {
    it('before any file, the picker says what to do; the select that holds the choice is hidden', async () => {
      const f = document.createElement('iframe'); f.src = '../../convert/index.html'; document.body.append(f);
      await waitFor(() => f.contentWindow && f.contentWindow.document.querySelector('[data-convert-root]') && f.contentWindow.document.querySelector('[data-convert-root]').convertTool, { timeout: 30000 });
      W = f.contentWindow; D = W.document; T = $('[data-convert-root]').convertTool;
      expect($('#cv-picker .cv-pick-empty').textContent).toBe('Add files to see what they can become');
      expect([$('#cv-target').hidden, $('#cv-picker').getAttribute('role')]).toEqual([true, 'radiogroup']);
    }, { timeout: 40000 });
    it('a CSV offers its formats as tiles in groups, the chosen one marked like the select', async () => {
      await T.addFiles([new W.File(['Name,Price\nGoo,4\n'], 'list.csv', { type: 'text/csv' })]);
      const ids = picks().map((b) => b.dataset.id);
      expect(ids.includes('csv-to-xlsx') && ids.includes('csv-to-json')).toBe(true);
      expect([...D.querySelectorAll('#cv-picker .cv-pick-h')].length > 1).toBe(true);
      const on = picks().filter((b) => b.getAttribute('aria-checked') === 'true');
      expect([on.length, on[0].dataset.id]).toEqual([1, $('#cv-target').value]);
      expect(!!on[0].querySelector('.sflow-solo .sflow-tile')).toBe(true);
      expect(picks().every((b) => !/[A-Z]{2,}-[A-Z]/.test(b.querySelector('.sflow-tile b').textContent))).toBe(true);   // no raw ids on tiles
    });
    it('a click picks the format: the select follows, the options and the picture change', async () => {
      picks().find((b) => b.dataset.id === 'csv-to-json').click();
      expect($('#cv-target').value).toBe('csv-to-json');
      expect(picks().find((b) => b.dataset.id === 'csv-to-json').getAttribute('aria-checked')).toBe('true');
      expect($('.cv-flow .sflow').getAttribute('aria-label')).toContain('JSON');
    });
    it('the arrow keys move the choice from tile to tile', async () => {
      const first = picks().find((b) => b.getAttribute('aria-checked') === 'true');
      first.focus();
      first.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      const now = picks().find((b) => b.getAttribute('aria-checked') === 'true');
      expect(now.dataset.id === 'csv-to-json').toBe(false);
      expect($('#cv-target').value).toBe(now.dataset.id);
      expect(D.activeElement).toBe(now);
    });
    it('the flow picture\'s target tile is a button with a ▾ that brings up the picker', async () => {
      const to = $('.cv-flow .sflow-to');
      expect([to.getAttribute('role'), to.getAttribute('aria-label'), !!to.querySelector('.sflow-caret')]).toEqual(['button', 'Choose the format to make', true]);
      D.body.focus();
      to.click();
      expect(D.activeElement.classList.contains('cv-pick')).toBe(true);
      expect(D.activeElement.getAttribute('aria-checked')).toBe('true');
    });
  });
  SlopTest.run({ name: 'Convert picker' });
  </script>
</body>
</html>
