<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Consent · settings page</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="frames.js"></script>
  <script>
  const { describe, it, beforeEach, expect, sleep, waitFor, run } = SlopTest;
  const { openPage, stubLoader, reset } = ConsentTest;
  // The real config has empty IDs, so toggling here can never load a third-party script.
  const page = () => openPage('../../settings/index.html');
  const record = () => JSON.parse(localStorage.getItem('slop-consent'));

  describe('settings page', () => {
    beforeEach(reset);
    it('starts with both switches off and no banner', async () => {
      const w = await page();
      expect(w.document.getElementById('set-analytics').checked).toBe(false);
      expect(w.document.getElementById('set-ads').checked).toBe(false);
      expect(w.document.getElementById('slopc-banner')).toBe(null);
      // The Patreon URL is set in shared/consent/config.js, so the Donate section is shown (it is hidden only when the URL is empty).
      expect(w.document.getElementById('donate').hidden).toBe(false);
    });
    it('the switches read and write the same record as the banner', async () => {
      const w = await page();
      const a = w.document.getElementById('set-analytics');
      a.checked = true;
      a.dispatchEvent(new w.Event('change'));
      expect(record().categories.analytics).toBe(true);
      expect(w.SlopConsent.state().analytics).toBe(true);
      a.checked = false;
      a.dispatchEvent(new w.Event('change'));
      expect(record().categories.analytics).toBe(false);
    });
    it('has a Storage section: usage bar, per-part list, persist button and the clear actions', async () => {
      const w = await page();
      const box = w.document.getElementById('storage-box');
      await waitFor(() => box.querySelector('.meter-bar') && box.querySelector('.storage-parts'));
      expect(box.querySelector('.meter-bar').getAttribute('role')).toBe('meter');
      expect(box.querySelector('.storage-parts').textContent).toContain('localStorage');
      expect(box.querySelector('[data-act="persist"]')).toBeTruthy();
      const acts = [...box.querySelectorAll('.storage-acts .btn')].map((b) => b.textContent);
      expect(acts.length).toBe(6);
      expect(acts[5]).toContain('never deletes your files');
      expect(box.textContent).toContain('Drive makes thumbnails');
    });
    it('the Storage clear actions ask first and do nothing when the person says no', async () => {
      const w = await page();
      const box = w.document.getElementById('storage-box');
      await waitFor(() => box.querySelector('.storage-acts .btn'));
      const before = w.document.querySelectorAll('.sui-dlg').length;
      box.querySelector('.storage-acts .btn').click();
      await waitFor(() => w.document.querySelectorAll('.sui-dlg').length > before);
      const dlg = [...w.document.querySelectorAll('.sui-dlg')].pop();
      expect(dlg.textContent).toContain('Your Drive files, documents and saved projects are not deleted.');
      dlg.querySelector('.sui-x').click();
      await waitFor(() => w.document.querySelectorAll('.sui-dlg').length === before);
    });
    it('shows the privacy sentence', async () => {
      const w = await page();
      expect(w.document.querySelector('.privacy').textContent).toContain('never leave your device');
    });
  });

  run({ name: 'Consent settings page' });
  </script>
</body>
</html>
