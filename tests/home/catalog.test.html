<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Homepage · catalog, carousel and navigation</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
    <script>try { localStorage.setItem('slop-firstrun:slopisolate', '1'); } catch (e) { /* private window */ }</script>
<script src="../harness.js"></script>
  <script src="boot.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  let win, doc;
  const ready = HomeTest.openHome().then((w) => { win = w; doc = w.document; });

  describe('catalog', () => {
    it('every registry app has a card in a section, and no card sits outside a section', async () => {
      await ready;
      const apps = win.SLOP_APPS;
      expect(apps.length).toBeGreaterThan(5);
      for (const a of apps) {
        const card = doc.querySelector(`[data-section] > [data-perch="card"][data-id="${a.id}"]`);
        if (!card) throw new Error('missing card for ' + a.id);
        expect(card.getAttribute('href')).toBe(a.path);
        expect(card.querySelector('h3').textContent).toBe(win.slopAppLabel(a, false));
      }
      expect(doc.querySelectorAll('[data-section] > [data-perch="card"]').length).toBeGreaterThan(apps.length);
    });
    it('compact cards show the tagline and a status badge from the registry, and no feature list', async () => {
      await ready;
      const labels = { live: 'Live', beta: 'Beta', building: 'In development' };
      for (const a of win.SLOP_APPS.filter((x) => x.kind === 'app')) {
        const card = doc.querySelector(`.app-card[data-id="${a.id}"]`);
        // A converter card shows its one-line "in and out" from SECTIONS, so the tagline is one of the two.
        const lines = [a.tagline].concat([].concat(win.SlopHomeSections.SECTIONS[a.id] || []).map((p) => p.line).filter(Boolean));
        expect(lines.includes(card.querySelector('.app-tag').textContent)).toBe(true);
        expect(card.querySelector('.feats')).toBe(null);
        const badge = card.querySelector('.badge');
        expect(badge.classList.contains(a.status)).toBe(true);
        expect(badge.textContent).toBe(labels[a.status]);
      }
    });
    it('every app card draws its own Sloppo badge, a lime tile holding the glyph', async () => {
      await ready;
      const ids = new Set();
      for (const a of win.SLOP_APPS.filter((x) => x.kind === 'app')) {
        const svg = doc.querySelector(`.shot[data-id="${a.id}"] svg.shot-icon`);
        if (!svg) throw new Error('no icon on the card for ' + a.id);
        expect(svg.getAttribute('data-icon')).toBe(a.id);
        expect(svg.querySelector('rect').getAttribute('fill')).toBe('#d4ff3a');
        expect(svg.querySelector('g').children.length).toBeGreaterThan(0);
        ids.add(svg.querySelector('g').innerHTML);
      }
      expect(doc.querySelectorAll('[data-section] .shot-icon').length).toBeGreaterThan(ids.size);
    });
    it('lists every project on the status board with matching counts', async () => {
      await ready;
      const apps = win.SLOP_APPS;
      expect(doc.querySelectorAll('#status-board .status-row').length).toBe(apps.length);
      const live = apps.filter((a) => a.status === 'live').length;
      expect(doc.getElementById('status-sum').textContent).toContain(`${apps.length} projects: ${live} live`);
      // In development first, live last.
      const states = [...doc.querySelectorAll('#status-board .dot')].map((d) => d.className.split(' ')[1]);
      const rank = { building: 0, beta: 1, live: 2 };
      for (let i = 1; i < states.length; i++) expect(rank[states[i]]).toBeGreaterThanOrEqual(rank[states[i - 1]]);
    });
  });

  describe('navigation', () => {
    for (const id of ['apps', 'status']) {
      it(`the ${id} tab jumps to its section`, async () => {
        await ready;
        win.scrollTo(0, 0);
        doc.documentElement.style.scrollBehavior = 'auto';
        doc.querySelector(`.tabs a[data-jump][href="#${id}"]`).click();
        const target = doc.getElementById(id);
        // Smooth scrolling; lazy screenshots above may still shift the layout a little.
        await waitFor(() => Math.abs(target.getBoundingClientRect().top - parseFloat(win.getComputedStyle(target).scrollMarginTop)) < 80, { timeout: 9000 });
        expect(win.location.hash).toBe('');
      });
    }
    it('switches to the Authenticator and back home', async () => {
      await ready;
      doc.defaultView.location.hash = '#detector';
      await waitFor(() => !doc.getElementById('view-detector').hidden);
      expect(doc.getElementById('view-home').hidden).toBe(true);
      expect(win.location.hash).toBe('#detector');
      doc.querySelector('.brand').click();
      await waitFor(() => !doc.getElementById('view-home').hidden);
      expect(doc.getElementById('view-detector').hidden).toBe(true);
    });
    it('a jump link works from the Authenticator view too', async () => {
      await ready;
      doc.defaultView.location.hash = '#detector';
      await waitFor(() => doc.getElementById('view-home').hidden);
      doc.querySelector('.tabs a[data-jump][href="#apps"]').click();
      await waitFor(() => !doc.getElementById('view-home').hidden);
      await waitFor(() => Math.abs(doc.getElementById('apps').getBoundingClientRect().top) < 120, { timeout: 5000 });
    });
    it('the Authenticator certifies pasted slop', async () => {
      await ready;
      doc.defaultView.location.hash = '#detector';
      doc.getElementById('sample-slop').click();
      await waitFor(() => !doc.getElementById('result').hidden);
      expect(+doc.getElementById('score').textContent).toBeGreaterThanOrEqual(0);
      doc.querySelector('.brand').click();
    });
    it('clicks on the mascot do not count as navigation', async () => {
      await ready;
      await HomeTest.settled(win);
      doc.documentElement.style.scrollBehavior = 'auto';
      await sleep(800);                        // let earlier smooth scrolls finish
      win.scrollTo(0, 300);
      await sleep(50);
      win.SlopMascot.M.hit.click();
      await sleep(50);
      expect(win.scrollY).toBe(300);
    });
  });

  describe('app carousel', () => {
    // The names the carousel leads with, in order. Any that the registry lacks are skipped.
    const TOP = ['PhotoSlop', 'SlopCut', 'SlopIsolate', 'SlopVector', 'Reel Remix', 'Slop Image to 3D', 'Slop Upscale', 'Slop Resize', 'Slop Docs', 'Slop Orders', 'Slop Invoices', 'Slop CRM', 'Slop Calendar', 'Slop Drive'];
    const slides = () => [...doc.querySelectorAll('.carousel .car-slide')];
    const names = () => slides().map((s) => s.querySelector('h3').textContent);
    const cur = () => slides().findIndex((s) => s.classList.contains('is-current'));
    const dots = () => [...doc.querySelectorAll('.carousel .car-dot')];
    const visible = () => dots().filter((d) => !d.hidden);
    const shown = (n) => { const a = win.SLOP_APPS.find((x) => x.name === n); return a ? win.slopAppLabel(a, false) : n; };
    const slideNamed = (n) => slides().find((s) => s.querySelector('h3').textContent === shown(n));
    // A dot is a control: it jumps and stops the auto-advance, so the tests below are not raced by the timer.
    // The strip shows only nearby dots, so a far slide is reached by its visible dot or by stepping with next/previous.
    const goto = (k) => {
      const d = doc.querySelector(`.carousel .car-dot[data-slide="${k}"]:not([hidden])`);
      if (d) return d.click();
      while (cur() < k) doc.querySelector('.carousel .car-next').click();
      while (cur() > k) doc.querySelector('.carousel .car-prev').click();
    };

    it('slides render in the order the top list gives, then the rest of the registry', async () => {
      await ready;
      const want = TOP.filter((n) => win.SLOP_APPS.some((a) => a.name === n))
        .concat(win.SLOP_APPS.filter((a) => !TOP.includes(a.name)).map((a) => a.name)).map(shown);
      expect(names()).toEqual(want);
      expect(slides().length).toBe(win.SLOP_APPS.length);
      expect(dots().length).toBe(win.SLOP_APPS.length);
    });
    it('each card and slide icon is an SVG-namespace svg with the badge rect and glyph group as direct children', async () => {
      await ready;
      const SVG = 'http://www.w3.org/2000/svg';
      const icons = [...doc.querySelectorAll('[data-section] .shot-icon'), ...doc.querySelectorAll('.carousel .car-icon')];
      expect(icons.length).toBeGreaterThan(win.SLOP_APPS.length);
      for (const svg of icons) {
        expect(svg.namespaceURI).toBe(SVG);
        expect(svg.getAttribute('viewBox')).toBe('0 0 48 48');
        const rect = svg.querySelector(':scope > rect');
        if (!rect) throw new Error('no badge rect as a direct child of ' + svg.getAttribute('class'));
        expect(rect.namespaceURI).toBe(SVG);
        expect(rect.getAttribute('fill')).toBe('#d4ff3a');
        expect(svg.querySelector(':scope > ellipse').namespaceURI).toBe(SVG);
        expect(svg.querySelector(':scope > g').namespaceURI).toBe(SVG);
      }
    });
    it('the carousel icon sits in its own visual column, after the text on wide screens', async () => {
      await ready;
      const s = slides()[0];
      expect(s.querySelector('.car-text svg')).toBe(null);
      expect(!!s.querySelector('.car-visual svg.car-icon')).toBe(true);
    });
    it('each slide shows the badge icon, the registry tagline, up to three features and a real Open link', async () => {
      await ready;
      for (const s of slides()) {
        const a = win.SLOP_APPS.find((x) => win.slopAppLabel(x, false) === s.querySelector('h3').textContent);
        expect(s.querySelector('svg.car-icon rect').getAttribute('fill')).toBe('#d4ff3a');
        expect(s.querySelector('.car-tag').textContent).toBe(a.tagline);
        const feats = s.querySelectorAll('.car-feats li');
        expect(feats.length).toBe(Math.min(3, (a.features || []).length));
        const open = s.querySelector('a.btn.primary');
        expect(open.tagName).toBe('A');
        expect(open.getAttribute('href')).toBe(a.path);
      }
    });
    it('the Tour button appears only for apps that have a tour', async () => {
      await ready;
      expect(!!slideNamed('PhotoSlop').querySelector('a[href="photoslop/?tour=1"]')).toBe(true);
      expect(!!slideNamed('SlopCut').querySelector('a[href="slopcut/?tour=1"]')).toBe(true);
      expect(!!slideNamed('The Authenticator').querySelector('a[href$="?tour=1"]')).toBe(false);
      expect(!!slideNamed('Slop Music').querySelector('a[href$="?tour=1"]')).toBe(false);
    });
    it('next and previous move one slide, and wrap at either end', async () => {
      await ready;
      goto(0);
      expect(cur()).toBe(0);
      doc.querySelector('.carousel .car-next').click();
      expect(cur()).toBe(1);
      expect(slides()[1].hasAttribute('inert')).toBe(false);
      expect(slides()[0].hasAttribute('inert')).toBe(true);
      doc.querySelector('.carousel .car-prev').click();
      expect(cur()).toBe(0);
      doc.querySelector('.carousel .car-prev').click();
      expect(cur()).toBe(slides().length - 1);
      doc.querySelector('.carousel .car-next').click();
      expect(cur()).toBe(0);
    });
    it('the dots reflect the current slide, and a dot jumps to its slide', async () => {
      await ready;
      goto(0);
      doc.querySelector('.carousel .car-next').click();
      const d = dots();
      expect(d[1].classList.contains('is-current')).toBe(true);
      expect(d[1].getAttribute('aria-current')).toBe('true');
      expect(d.filter((x) => x.classList.contains('is-current')).length).toBe(1);
      expect(d[0].hasAttribute('aria-current')).toBe(false);
      goto(5);
      expect(cur()).toBe(5);
      expect(dots()[5].getAttribute('aria-current')).toBe('true');
      expect(dots()[1].hasAttribute('aria-current')).toBe(false);
      visible().find((x) => x.dataset.slide === '6').click();
      expect(cur()).toBe(6);
    });
    it('the pager shows the counter and at most seven dots, always including the first and last slide', async () => {
      await ready;
      const n = slides().length;
      for (const k of [0, 1, 3, Math.floor(n / 2), n - 2, n - 1]) {
        goto(k);
        expect(doc.querySelector('.carousel .car-count').textContent).toBe(`${k + 1} / ${n}`);
        const shown = visible().map((d) => +d.dataset.slide);
        expect(shown.length).toBeLessThanOrEqual(7);
        expect(shown).toContain(0);
        expect(shown).toContain(n - 1);
        expect(shown).toContain(k);
      }
      expect(doc.querySelectorAll('.carousel .car-pause').length).toBe(1);
      expect(doc.querySelectorAll('.carousel .car-prev, .carousel .car-next').length).toBe(2);
    });
    it('the arrow keys move the carousel when focus is inside it', async () => {
      await ready;
      goto(0);
      const region = doc.querySelector('.carousel');
      region.querySelector('.car-next').focus();
      region.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      expect(cur()).toBe(1);
      region.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
      expect(cur()).toBe(0);
    });
    it('the live region announces the current slide', async () => {
      await ready;
      goto(0);
      doc.querySelector('.carousel .car-next').click();
      const live = doc.querySelector('.carousel [aria-live]');
      expect(live.textContent).toBe(`Slide 2 of ${slides().length}: ${names()[1]}`);
    });
    it('auto-advances every 7 seconds, pauses on hover, and stops for good once a control is used', async () => {
      const w = await HomeTest.openHome();     // a fresh page: nothing has been clicked yet
      const d = w.document, region = d.querySelector('.carousel');
      const idx = () => [...d.querySelectorAll('.carousel .car-slide')].findIndex((s) => s.classList.contains('is-current'));
      region.dispatchEvent(new w.Event('pointerenter'));
      await sleep(7600);
      expect(idx()).toBe(0);
      region.dispatchEvent(new w.Event('pointerleave'));
      await waitFor(() => idx() === 1, { timeout: 9000 });
      d.querySelector('.carousel .car-next').click();
      expect(idx()).toBe(2);
      await sleep(7600);
      expect(idx()).toBe(2);
    }, { timeout: 40000 });
  });

  ready.then(() => sleep(100)).then(() => run());
  </script>
</body>
</html>
