<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Homepage · hero links, keyboard list and buttons</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; } iframe { display: block; border: 0; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="hero-boot.js"></script>
  <script>
  // Covers: home/vortex/vortex.js, home/browse.js, index.html
  /* The hero's links: every vortex icon is a link to its app with the app's name, hovering one shows the name and slows
   * the swirl, the keyboard list holds every app as one tab stop moved with the arrow keys, Open the apps puts the cursor in
   * the finder's search, How it works opens its page; the copy is translated through shared/i18n. */
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  let win, doc;
  const ready = HeroTest.open({ width: 1280 }).then((w) => { win = w; doc = w.document; });
  const label = (a) => win.slopAppLabel(a, win.slopBrandNamesOn());

  describe('vortex icons', () => {
    it('each icon is a link to an app, named after it, out of the tab order and hidden from screen readers', async () => {
      await ready;
      const icons = [...doc.querySelectorAll('.vx-layer .vx-i')];
      expect(icons.length).toBeGreaterThan(10);
      for (const n of icons) {
        expect(n.tagName).toBe('A');
        const app = win.SLOP_APPS.find((a) => a.id === n.dataset.id);
        if (!app) throw new Error('no app for icon ' + n.dataset.id);
        expect(n.getAttribute('href')).toBe(app.path);
        expect(n.getAttribute('aria-label')).toBe(label(app));
        expect(n.querySelector('.vx-name').textContent).toBe(label(app));
        expect(n.querySelector('svg.vx-svg') !== null).toBe(true);
        expect(n.getAttribute('tabindex')).toBe('-1');
        expect(n.getAttribute('aria-hidden')).toBe('true');
      }
      expect(doc.querySelector('.vx-layer').getAttribute('aria-hidden')).toBe('true');
    });
    it('hovering an icon shows its name, holds it in full view and slows the swirl; leaving lets it go', async () => {
      await ready;
      await waitFor(() => win.SlopVortex.icons().some((i) => i.opacity > 0.5), { timeout: 5000 });
      const ic = win.SlopVortex.icons().filter((i) => i.opacity > 0.5)[0];
      ic.el.dispatchEvent(new win.PointerEvent('pointerover', { bubbles: true, pointerType: 'mouse' }));
      expect(ic.el.classList.contains('is-hot')).toBe(true);
      await waitFor(() => win.getComputedStyle(ic.el.querySelector('.vx-name')).opacity === '1', { timeout: 5000 });   // after its fade
      expect(Number(ic.el.style.opacity)).toBe(1);
      const r1 = ic.el.getBoundingClientRect();
      await sleep(300);
      const r2 = ic.el.getBoundingClientRect();
      expect(Math.hypot(r2.left - r1.left, r2.top - r1.top)).toBeLessThan(2);   // it stays put while pointed at
      ic.el.dispatchEvent(new win.PointerEvent('pointerout', { bubbles: true, pointerType: 'mouse', relatedTarget: doc.body }));
      expect(ic.el.classList.contains('is-hot')).toBe(false);
    });
  });

  describe('the keyboard list', () => {
    it('lists every app with an icon and a page, as one tab stop', async () => {
      await ready;
      const links = [...doc.querySelectorAll('.vx-nav a')];
      const want = win.SLOP_APPS.filter((a) => !a.path.startsWith('#') && win.SLOP_ICONS[a.id]);
      expect(links.map((a) => a.getAttribute('href'))).toEqual(want.map((a) => a.path));
      expect(links.map((a) => a.textContent)).toEqual(want.map(label));
      expect(links.filter((a) => a.tabIndex === 0).length).toBe(1);
      expect(doc.querySelector('.vx-nav').getAttribute('aria-label')).toBe('Every app');
      expect(links[0].getBoundingClientRect().width).toBeLessThan(2);   // hidden until focused
    });
    it('the arrow keys move along it; the focused app shows as a chip and lights its icon; the swirl waits', async () => {
      await ready;
      const links = [...doc.querySelectorAll('.vx-nav a')];
      links[0].focus();
      expect(win.SlopVortex.state()).toBe('paused');
      const key = (k) => doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, bubbles: true }));
      key('ArrowRight');
      expect(doc.activeElement).toBe(links[1]);
      expect(links[1].tabIndex).toBe(0);
      expect(links[0].tabIndex).toBe(-1);
      key('ArrowLeft'); key('ArrowLeft');
      expect(doc.activeElement).toBe(links[links.length - 1]);
      key('Home');
      expect(doc.activeElement).toBe(links[0]);
      // focus one that is on screen in the vortex: its icon is lit
      const live = win.SlopVortex.icons()[0];
      const target = links.find((a) => a.dataset.id === live.id);
      target.focus();
      expect(target.getBoundingClientRect().width).toBeGreaterThan(40);
      expect(live.el.classList.contains('is-lit')).toBe(true);
      expect(Number(live.el.style.opacity)).toBe(1);
      target.blur();
      expect(live.el.classList.contains('is-lit')).toBe(false);
      expect(win.SlopVortex.state()).toBe('running');
    });
  });

  describe('buttons and copy', () => {
    it('Open the apps scrolls to the finder and puts the cursor in its search', async () => {
      await ready;
      const btn = doc.querySelector('.hx-cta a[data-to-finder]');
      expect(btn.textContent.trim()).toMatch(/^Open the apps/);
      expect(btn.getAttribute('href')).toBe('#app-finder');   // without scripts it still lands on the finder
      if (doc.activeElement) doc.activeElement.blur();   // the search may have focus already (autofocus on desktop)
      expect(doc.activeElement === doc.querySelector('#app-finder .fd-input')).toBe(false);
      btn.click();
      expect(doc.activeElement).toBe(doc.querySelector('#app-finder .fd-input'));
      await waitFor(() => Math.abs(doc.getElementById('app-finder').getBoundingClientRect().top) < 200, { timeout: 5000 });
      win.scrollTo(0, 0);
    });
    it('How it works opens the how-it-works page; the meta line links the source on GitHub', async () => {
      await ready;
      const how = [...doc.querySelectorAll('.hx-cta a')].find((a) => /How it works/.test(a.textContent));
      expect(how.getAttribute('href')).toBe('how-it-works/');
      const res = await fetch('../../how-it-works/');
      expect(res.ok).toBe(true);
      expect(doc.querySelector('.hx-meta a').getAttribute('href')).toBe('https://github.com/slopographic/apps');
      expect(doc.querySelector('.hx-meta').textContent).toMatch(/Works offline.*No account needed/);
    });
    it('one h1, the headline, with its accent word in the serif; the copy follows the language', async () => {
      await ready;
      expect(doc.querySelectorAll('#view-home h1').length).toBe(1);   // (the Authenticator view has its own)
      const h1 = doc.querySelector('#view-home h1');
      expect(h1.closest('#hero') !== null).toBe(true);
      expect(win.getComputedStyle(h1.querySelector('em')).fontFamily).toMatch(/Instrument Serif/);
      win.SlopI18n.set('es');
      expect(doc.querySelector('[data-i18n="hero.open"]').textContent).toBe('Abrir las apps');
      expect(h1.querySelector('em').textContent).toBe('abierta en tu navegador.');
      expect(doc.querySelector('.hx-marquee .mq-list').getAttribute('aria-label')).toBe('Lo que hacen las apps');
      win.SlopI18n.set('en');
      expect(h1.textContent).toBe('The whole toolbox, open in your browser.');
    });
  });

  ready.then(() => run({ name: 'Homepage · hero links, keyboard list and buttons' }));
  </script>
</body>
</html>
