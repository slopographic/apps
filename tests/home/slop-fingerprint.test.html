<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Homepage · slop engine fingerprint (this site's text)</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <!-- Repo-only (tests/repo-only.json): the fingerprint is of this site's own words, which a white-label build renames.
       The engine's behaviour in every build: tests/home/slop.test.html. -->
  <script src="../harness.js"></script>
  <script src="../../slop/core.js"></script>
  <script src="../../slop/gen-feeds.js"></script>
  <script src="../../slop/gen-more.js"></script>
  <script src="../../slop/engine.js"></script>
  <script src="../../slop/detect.js"></script>
  <script>
  const { describe, it, expect, run } = SlopTest;
  const S = window.Slop;

  describe('slop engine (slop/)', () => {
    it('generates exactly what the original engine generated (fingerprint)', () => {
      // Fingerprint taken from the original 597-line slop.js before the split.
      let s = '';
      for (const g of S.GENRES) for (let i = 0; i < 20; i++) for (let lv = 1; lv <= 5; lv++) {
        const p = S.generate(g.key, i * 101 + 7, lv);
        s += JSON.stringify(p) + S.analyze(S.plainText(p)).score;
      }
      let h = 2166136261 >>> 0;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      expect([s.length, h.toString(16)]).toEqual([988507, 'd4c601b5']);
    });
  });
  run();
  </script>
</body>
</html>
