<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Homepage · slop engine</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../slop/core.js"></script>
  <script src="../../slop/gen-feeds.js"></script>
  <script src="../../slop/gen-more.js"></script>
  <script src="../../slop/engine.js"></script>
  <script src="../../slop/detect.js"></script>
  <script>
  const { describe, it, expect, run } = SlopTest;
  const S = window.Slop;

  describe('slop engine (slop/)', () => {
    it('exposes the same API as the old single-file slop.js', () => {
      for (const k of ['GENRES', 'GENRE', 'MAX_LEVEL', 'generate', 'parseId', 'plainText', 'analyze', 'TIERS', 'makeRand', 'hashString']) expect(k in S).toBe(true);
      expect(S.GENRES.map((g) => g.key)).toEqual(['linkedin', 'facebook', 'seo', 'amazon', 'youtube', 'thread', 'email', 'chatbot', 'quote']);
      expect(S.MAX_LEVEL).toBe(5);
    });
    it('generates the same posts again from the same seed, and other posts from another', () => {
      const one = JSON.stringify(S.GENRES.map((g) => S.generate(g.key, 707, 3)));
      expect(JSON.stringify(S.GENRES.map((g) => S.generate(g.key, 707, 3)))).toBe(one);
      expect(JSON.stringify(S.GENRES.map((g) => S.generate(g.key, 708, 3))) === one).toBe(false);
      // this site's exact text against the engine before its split: tests/home/slop-fingerprint.test.html (repo-only)
    });
    it('round-trips post ids', () => {
      const p = S.generate('thread', 12345, 3);
      expect(S.parseId(p.id)).toEqual({ genre: 'thread', seed: 12345, level: 3 });
      expect(S.parseId('nope-1-9')).toBe(null);
    });
    it('the detector scores slop high and humans low', () => {
      const r = S.analyze('We delve into the rich tapestry of synergy. Let that sink in. 🚀');
      expect(r.score).toBe(99);
      expect(r.tier.name).toBe('Industrial-Grade Slop');
      expect(r.spans.length).toBeGreaterThan(0);
      expect(S.analyze('Took the dog to the vet. She ate a sock again.').score).toBeLessThan(30);
    });
    it('seeded random numbers are deterministic', () => {
      const a = S.makeRand(42), b = S.makeRand(42);
      for (let i = 0; i < 10; i++) expect(a.f()).toBe(b.f());
      expect(S.hashString('slop')).toBe(S.hashString('slop'));
    });
  });
  run();
  </script>
</body>
</html>
