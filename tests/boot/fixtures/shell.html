<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boot fixture: a page whose shell is ready late</title>
  <script src="../../../shared/boot/boot.js"></script>
</head>
<body>
  <script>
  // A stand-in for shell/shell.js: its header buttons come 400 ms after parsing, well past the quiet wait.
  let done;
  window.SlopShell = { ready: new Promise((r) => { done = r; }) };
  document.addEventListener('DOMContentLoaded', () => setTimeout(() => { window.shellAt = performance.now(); done(); }, 400));
  </script>
</body>
</html>
