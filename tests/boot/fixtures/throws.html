<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boot fixture: a page whose script throws and keeps changing</title>
  <script src="../../../shared/boot/boot.js"></script>
</head>
<body>
  <script>
  // Changes every 50 ms for ever (no quiet moment), and has a script error after parsing: the error event an uncaught
  // throw sends to the window, sent by hand so the test run's console stays clean.
  setInterval(() => document.body.append(document.createElement('i')), 50);
  document.addEventListener('DOMContentLoaded', () => setTimeout(() => window.dispatchEvent(new ErrorEvent('error', { message: 'boom' })), 300));
  </script>
</body>
</html>
