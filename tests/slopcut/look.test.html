<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SlopCut: the look (top bar at 1440, 1024 and 390 wide)</title>
<style>body { margin: 0; } iframe { border: 0; display: block; height: 800px; }</style></head>
<body>
  <!-- Covers: slopcut/css/base.css, slopcut/css/themes.css -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  /** The app in a fresh iframe of this width, once it is ready and the shell's, Drive's and View's buttons are in. */
  async function open(width) {
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../slopcut/index.html';
    document.body.append(f);
    await waitFor(() => { const D = f.contentDocument; return D && D.body && D.body.classList.contains('ready') && D.querySelector('.topbar .sh-switch') && D.querySelector('.topbar .sdl') && D.querySelector('.topbar .slopvm-btn'); }, { timeout: 40000 });
    await sleep(400);   // shared/ui/hbtn.js settles the labels on the next frame
    return f;
  }
  const visible = (D, sel) => [...D.querySelectorAll(sel)].filter((n) => n.getBoundingClientRect().width > 0);

  describe('SlopCut: the look', () => {
    for (const w of [1440, 1024, 390]) {
      it(`at ${w}px nothing in the top bar passes the right edge, and the shared buttons match Undo`, async () => {
        const f = await open(w), D = f.contentDocument, W = f.contentWindow;
        const bar = D.querySelector('.topbar');
        expect(bar.scrollWidth).toBeLessThanOrEqual(bar.clientWidth);
        expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(w);
        for (const n of visible(D, '.topbar a, .topbar button, .topbar input')) expect(n.getBoundingClientRect().right).toBeLessThanOrEqual(w + 0.5);
        const own = D.getElementById('btnUndo').getBoundingClientRect();
        for (const n of visible(D, '.topbar .slop-hbtn')) {
          const r = n.getBoundingClientRect();
          if (w > 760) expect(r.height).toBe(own.height);   // the phone bar makes its own buttons taller for touch
          expect(Math.abs((r.top + r.bottom) / 2 - (own.top + own.bottom) / 2)).toBeLessThan(1.5);
        }
        // the View button is the shared icon alone, without the glyph SlopCut once drew in front of it
        expect(W.getComputedStyle(D.querySelector('.slopvm-btn'), '::before').content).toBe('none');
        f.remove();
      }, { timeout: 60000 });
    }
  });
  SlopTest.run({ name: 'SlopCut: the look' });
  </script>
</body>
</html>
