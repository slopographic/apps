<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop PDF saved view</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script src="pdf.helpers.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  describe('Slop PDF saved view', () => {
    it('brings back the open page, tool and zoom after leaving for Slop Drive and coming back', async () => {
      await PT.boot('', 'app');
      const { E, A, SP } = PT;
      E.commit('Blank', (st) => E.ops.insert(st, 0, [E.blankPage(200, 100)]));
      const pid = E.state.pages[0].id;
      A.setTool('edit');
      A.openPage(pid);
      SP.editor.zoomMode = 'num'; SP.editor.zoom = 1.5; SP.editor.layout();
      document.getElementById('app').contentDocument.body.dispatchEvent(new (document.getElementById('app').contentWindow.MouseEvent)('click', { bubbles: true })); // a user gesture, as the app saves on input
      await sleep(1600); // the session autosave is debounced by about a second
      const fr = document.getElementById('app');
      fr.src = '../drive/frame.html';
      await sleep(1500);
      const pre = await PT.win.SlopSession.load('pdf', 'view', 'none');
      expect(JSON.stringify(pre)).toBe('x');
      await PT.boot('', 'app');
      await sleep(300);
      const sv = await PT.win.SlopSession.load('pdf', 'view', null);
      expect(JSON.stringify([sv, PT.A.tool, PT.A.mode, PT.SP.editor.pid])).toBe('x');
      expect(PT.A.tool).toBe('edit');
      expect(PT.SP.editor.pid).toBe(pid);
      expect(PT.SP.editor.zoomMode).toBe('num');
      expect(PT.SP.editor.zoom).toBeCloseTo(1.5, 1e-6);
    }, { timeout: 90000 });
  });
  run({ name: 'Slop PDF · saved view' });
  </script>
</body>
</html>
