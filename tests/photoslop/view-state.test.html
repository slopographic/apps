<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSLOP saved view</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  const f = document.getElementById('app');
  const isReady = (w) => w && w.document.body && w.document.body.classList.contains('ready');
  /** Load a page in the iframe and wait until PhotoSLOP has booted (body.ready). */
  async function open(src) {
    const want = new URL(src, location.href).pathname, app = src.includes('photoslop');
    f.src = src; console.error('DBG open ' + src);
    await waitFor(() => f.contentWindow && f.contentWindow.location.pathname === want && f.contentWindow.document.readyState === 'complete' && (!app || isReady(f.contentWindow)), { timeout: 20000 });
    return f.contentWindow;
  }

  describe('PhotoSLOP saved view', () => {
    it('keeps the zoom and hidden panels after leaving for Slop Drive and coming back', async () => {
      let W = await open('../../photoslop/index.html');
      console.error('DBG a'); await W.autosave(); console.error('DBG b');
      W.setZoom(2);
      W.dirty();
      W.document.body.classList.add('no-panels');
      await sleep(400);
      console.error('DBG c'); await open('../drive/frame.html'); console.error('DBG d');
      await sleep(60);
      W = await open('../../photoslop/index.html');
      await waitFor(() => W.V && W.V.zoom > 0);
      expect(W.V.zoom).toBeCloseTo(2, 1e-6);
      expect(W.document.body.classList.contains('no-panels')).toBe(true);
    }, { timeout: 90000 });
  });
  run({ name: 'PhotoSLOP · saved view' });
  </script>
</body>
</html>
