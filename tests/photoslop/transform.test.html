<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSLOP transform tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <iframe id="app" src="../../photoslop/index.html"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  let W, win;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  /** Client point for a document point (the viewport is at 100 % for these small documents). */
  const scr = (x, y) => { const r = W.V.el.getBoundingClientRect(); return { x: r.left + W.V.ox + x * W.V.zoom, y: r.top + W.V.oy + y * W.V.zoom }; };
  function ptr(type, x, y, opts = {}) {
    W.V.el.dispatchEvent(new win.PointerEvent(type, Object.assign({ clientX: x, clientY: y, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 9, pointerType: 'mouse', bubbles: true, cancelable: true }, opts)));
  }
  /** A drag through document points (first point = pointer down, last = pointer up). */
  function drag(pts, opts = {}) {
    const a = scr(...pts[0]); ptr('pointerdown', a.x, a.y, opts);
    for (const q of pts.slice(1)) { const b = scr(...q); ptr('pointermove', b.x, b.y, opts); }
    const z = scr(...pts[pts.length - 1]); ptr('pointerup', z.x, z.y, opts);
  }
  /** A key press on the page (SlopCmd and the tool keys listen on window). */
  const key = (k, mods = {}) => win.document.body.dispatchEvent(new win.KeyboardEvent('keydown', Object.assign({ code: k, key: k, bubbles: true, cancelable: true }, mods)));
  /** Pixel [r,g,b,a] of a canvas at (x, y); out of range reads as transparent. */
  const px = (c, x, y) => [...c.getContext('2d', { willReadFrequently: true }).getImageData(x, y, 1, 1).data];
  /** Pixel [r,g,b,a] of the active layer at a document point. */
  const at = (x, y) => { const L = W.activeLayer(); return px(L.canvas, x - L.x, y - L.y); };
  /** All pixel bytes of a canvas (compared with deepEqual). */
  const bytes = (c) => c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height).data;
  const opaqueCount = (c) => { const d = bytes(c); let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i]) n++; return n; };
  /** A new document whose active layer is `paint(g)` on a fresh canvas. */
  function scene(name, w, hh, paint, bg = '#ffffff') {
    W.newDocTab(w, hh, bg, name); W.actualPixels(); W.selectTool('move'); W.setColor('fg', '#000000');
    const c = W.mkCanvas(w, hh), g = W.cx(c); if (paint) paint(g, c);
    W.addLayer({ name: 'Scene', canvas: c }, 'Add Scene');
    return W.activeLayer();
  }
  /** The menu item at group › label (searching submenus). */
  function menuItem(group, label) {
    const find = (list) => list.reduce((a, it) => a || (it && it.label === label ? it : it && it.sub ? find(it.sub) : null), null);
    return find(W.MENUS.find(([n]) => n === group)[1]);
  }
  /** Dialog helpers: the newest SlopUI dialog. */
  const dlg = () => [...win.document.querySelectorAll('.sui-dlg')].pop();
  const dlgBtn = (label) => [...dlg().querySelectorAll('.sui-btn')].find((b) => b.textContent === label);
  const fld = (label) => dlg().querySelector(`[aria-label="${label}"]`);
  const setVal = (el, v) => { el.value = String(v); el.dispatchEvent(new win.Event('input', { bubbles: true })); el.dispatchEvent(new win.Event('change', { bubbles: true })); };
  /** Drags the bottom-right handle so the box is f times its size (anchored at the top-left corner). */
  function scaleBox(f) {
    const cs = W.tfCorners(), tl = cs[0], br = cs[2];
    const to = { x: tl.x + (br.x - tl.x) * f, y: tl.y + (br.y - tl.y) * f };
    drag([[br.x, br.y], [(br.x + to.x) / 2, (br.y + to.y) / 2], [to.x, to.y]]);
  }

  describe('Transform: Image Size, Canvas Size, rotate and flip, Free Transform', () => {
    it('boots', async () => {
      win = document.getElementById('app').contentWindow;
      await waitFor(() => win.document && win.document.body && win.document.body.classList.contains('ready'), { timeout: 30000 });
      W = new Proxy({}, { get: (_, k) => win.eval(String(k)) });
      expect(typeof W.resizeCanvas).toBe('function');
      expect(typeof W.dlgImageSize).toBe('function');
    }, { timeout: 40000 });

    it('Image Size halves a 200 × 100 document to 100 × 50, keeping the aspect ratio, in one undo step', async () => {
      W.newDocTab(200, 100, '#ffffff', 'Halve'); W.actualPixels();
      const before = W.Hist.idx;
      W.dlgImageSize();
      await waitFor(() => fld('Width'));
      expect(fld('Height').value).toBe('100');
      setVal(fld('Width'), 100);
      expect(fld('Height').value).toBe('50');
      expect(dlg().textContent).toContain('New size: 100 × 50 px');
      dlgBtn('OK').click();
      await waitFor(() => W.Hist.idx === before + 1);
      expect([W.D.w, W.D.h]).toEqual([100, 50]);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Image Size');
    });

    it('Image Size in percent with the link off sets each side on its own', async () => {
      W.newDocTab(200, 100, '#ffffff', 'Percent'); W.actualPixels();
      const before = W.Hist.idx;
      W.dlgImageSize();
      await waitFor(() => fld('Units'));
      setVal(fld('Units'), '%');
      expect(fld('Width').value).toBe('100');
      setVal(fld('Width'), 50);
      expect(fld('Height').value).toBe('50');
      dlg().querySelector('.btn.primary[aria-pressed]').click();
      expect(dlg().querySelector('[aria-pressed]').getAttribute('aria-pressed')).toBe('false');
      setVal(fld('Height'), 25);
      expect(dlg().textContent).toContain('New size: 100 × 25 px');
      dlgBtn('OK').click();
      await waitFor(() => W.Hist.idx === before + 1);
      expect([W.D.w, W.D.h]).toEqual([100, 25]);
    });

    it('Canvas Size anchored bottom-right adds transparent space on the left and top', async () => {
      W.newDocTab(200, 100, 'transparent', 'Grow'); W.actualPixels();
      const L0 = W.activeLayer(), g0 = W.cx(L0.canvas); g0.fillStyle = '#ff0000'; g0.fillRect(0, 0, 10, 10);
      W.dlgCanvasSize();
      await waitFor(() => fld('Width'));
      setVal(fld('Width'), 300); setVal(fld('Height'), 150);
      dlg().querySelector('[aria-label="Anchor bottom right"]').click();
      dlgBtn('OK').click();
      await waitFor(() => W.D.w === 300);
      expect([W.D.w, W.D.h]).toEqual([300, 150]);
      expect([W.activeLayer().x, W.activeLayer().y]).toEqual([100, 50]);
      const flat = W.flattenCanvas();
      expect(px(flat, 0, 0)[3]).toBe(0);
      expect(px(flat, 99, 49)[3]).toBe(0);
      expect(px(flat, 100, 50)).toEqual([255, 0, 0, 255]);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Canvas Size');
      expect(W.D.layers.length).toBe(1);
    });

    it('Canvas Size with a white extension adds one bottom layer that covers only the new area', async () => {
      W.newDocTab(200, 100, 'transparent', 'Extend'); W.actualPixels();
      W.dlgCanvasSize();
      await waitFor(() => fld('Width'));
      setVal(fld('Width'), 240);
      dlg().querySelector('[aria-label="Anchor middle left"]').click();
      setVal(dlg().querySelector('[aria-label="Canvas extension"]'), 'white');
      dlgBtn('OK').click();
      await waitFor(() => W.D.w === 240);
      expect(W.D.layers.length).toBe(2);
      expect(W.D.layers[0].name).toBe('Canvas Fill');
      const flat = W.flattenCanvas();
      expect(px(flat, 220, 50)).toEqual([255, 255, 255, 255]);
      expect(px(flat, 10, 10)[3]).toBe(0);
    });

    it('Image > Rotate 90° Clockwise turns 200 × 100 into 100 × 200 and moves every pixel', () => {
      scene('Turn', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(10, 20, 1, 1); g.fillStyle = '#0000ff'; g.fillRect(150, 80, 1, 1); g.fillStyle = '#00ff00'; g.fillRect(0, 0, 30, 5); }, 'transparent');
      const count = opaqueCount(W.activeLayer().canvas), before = W.Hist.idx;
      menuItem('Image', 'Rotate 90° Clockwise').act();
      expect([W.D.w, W.D.h]).toEqual([100, 200]);
      expect(at(79, 10)).toEqual([255, 0, 0, 255]);
      expect(at(19, 150)).toEqual([0, 0, 255, 255]);
      expect(opaqueCount(W.activeLayer().canvas)).toBe(count);
      expect(W.Hist.idx).toBe(before + 1);
    });

    it('Image > Flip Horizontal mirrors a marked pixel', () => {
      scene('Mirror', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(30, 40, 1, 1); }, 'transparent');
      menuItem('Image', 'Flip Horizontal').act();
      expect(at(169, 40)).toEqual([255, 0, 0, 255]);
      expect(at(30, 40)[3]).toBe(0);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Flip Horizontal');
    });

    it('Layer > Rotate and Flip > Flip Horizontal turns only the active layer, in one undo step', () => {
      const L = scene('Layer flip', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(60, 30, 20, 10); g.fillStyle = '#0000ff'; g.fillRect(60, 30, 5, 10); }, 'transparent');
      const before = W.Hist.idx, data = bytes(L.canvas);
      menuItem('Layer', 'Rotate and Flip').sub.find((x) => x.label === 'Flip Horizontal').act();
      expect(W.Hist.idx).toBe(before + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Flip Horizontal');
      expect(at(79, 35)).toEqual([0, 0, 255, 255]);
      expect(at(60, 35)).toEqual([255, 0, 0, 255]);
      W.undo();
      expect(bytes(W.activeLayer().canvas)).toEqual(data);
    });

    it('Free Transform: a drag scales the layer to 50 % and Escape leaves it unchanged', async () => {
      const L0 = scene('Scale', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(60, 30, 40, 30); }, 'transparent');
      const before = bytes(L0.canvas), hist = W.Hist.idx;
      W.startTransform();
      expect(W.TRANSFORM.active).toBe(true);
      scaleBox(0.5);
      expect(W.TRANSFORM.sx).toBeCloseTo(0.5, 0.02);
      key('Escape');
      expect(W.TRANSFORM.active).toBe(false);
      expect(W.activeLayer().canvas).toBe(L0.canvas);
      expect(bytes(W.activeLayer().canvas)).toEqual(before);
      expect(W.Hist.idx).toBe(hist);
    });

    it('Free Transform: Enter applies the scale in one step, and one undo restores the layer', async () => {
      const L0 = scene('Apply', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(60, 30, 40, 30); }, 'transparent');
      const before = bytes(L0.canvas), hist = W.Hist.idx, count = opaqueCount(L0.canvas);
      W.startTransform();
      scaleBox(0.5);
      key('Enter');
      expect(W.TRANSFORM.active).toBe(false);
      expect(W.Hist.idx).toBe(hist + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Free Transform');
      expect(opaqueCount(W.activeLayer().canvas)).toBeLessThan(count / 2);
      W.undo();
      expect(W.Hist.idx).toBe(hist);
      expect(bytes(W.activeLayer().canvas)).toEqual(before);
    });

    it('arrow keys nudge the layer 1 px, and Shift+arrow 10 px, with the Move tool', () => {
      scene('Nudge', 200, 100, (g) => { g.fillStyle = '#ff0000'; g.fillRect(50, 50, 4, 4); }, 'transparent');
      W.selectTool('move');
      const x0 = W.activeLayer().x, y0 = W.activeLayer().y;
      key('ArrowRight'); expect([W.activeLayer().x, W.activeLayer().y]).toEqual([x0 + 1, y0]);
      key('ArrowDown'); expect([W.activeLayer().x, W.activeLayer().y]).toEqual([x0 + 1, y0 + 1]);
      key('ArrowRight', { shiftKey: true }); expect(W.activeLayer().x).toBe(x0 + 11);
    });

    it('every new transform item is a command, and the layer menu offers the transform items', () => {
      for (const [g, l] of [['Image', 'Rotate 90° Clockwise'], ['Image', 'Flip Vertical'], ['Image', 'Image Size…'], ['Image', 'Canvas Size…'], ['Layer', 'Rotate 180°'], ['Layer', 'Flip Vertical']]) {
        expect(menuItem(g, l).cmdId).toMatch(/^ps\./);
      }
      expect(menuItem('Layer', 'Rotate and Flip').sub.length).toBe(6);
      expect(W.SlopCmd.keyFor(menuItem('Image', 'Image Size…').cmdId)).toMatch(/I$/);
      expect(W.SlopCmd.keyFor(menuItem('Image', 'Canvas Size…').cmdId)).toMatch(/C$/);
      expect(W.SlopCmd.keyFor(menuItem('Edit', 'Free Transform').cmdId)).toMatch(/T$/);
      const labels = W.layerItems(W.activeLayer()).map((x) => x && x.label);
      expect(labels).toContain('Free Transform');
      expect(labels).toContain('Rotate and Flip');
    });
  });
  SlopTest.run({ name: 'PhotoSLOP transform' });
  </script>
</body>
</html>
