<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSlop masks tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <iframe id="app" src="../../photoslop/index.html"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  let W, win;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ev = (type, x, y) => new win.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y });
  /** A drag with the active tool from document point a to b (on the viewport). */
  function drag(a, b) {
    const el = W.eval('V.el'), at = (p) => W.eval(`toScreen(${p.x}, ${p.y})`), r = el.getBoundingClientRect();
    const s = at(a), e = at(b);
    el.dispatchEvent(ev('pointerdown', r.left + s.x, r.top + s.y));
    el.dispatchEvent(ev('pointermove', r.left + (s.x + e.x) / 2, r.top + (s.y + e.y) / 2));
    el.dispatchEvent(ev('pointermove', r.left + e.x, r.top + e.y));
    el.dispatchEvent(ev('pointerup', r.left + e.x, r.top + e.y));
  }
  /** A menu item by its path, e.g. menuItem('Layer', 'Mask', 'Invert'). */
  const menuItem = (...path) => W.eval(`(function () { let items = MENUS.find(function (m) { return m[0] === ${JSON.stringify(path[0])}; })[1], it = null;
    for (const l of ${JSON.stringify(path.slice(1))}) { it = items.find(function (x) { return x && x.label === l; }); if (!it) throw new Error('no menu item ' + l); items = it.sub; }
    return it; })()`);
  const run = (...path) => menuItem(...path).act();
  /** The mask's alpha at a document point; outside its canvas the mask's default applies. */
  const maskAt = (L, x, y) => { const m = L.mask, px = x - m.x, py = y - m.y; if (px < 0 || py < 0 || px >= m.canvas.width || py >= m.canvas.height) return m.def ? 0 : 255; return pixel(m.canvas, px, py)[3]; };
  /** The flattened page (white behind everything) at a document point. */
  const colorAt = (x, y) => pixel(W.flattenCanvas('#ffffff'), x, y);
  /** A 300×200 document with one layer named 'Ink' of the given fill, covering all of it. */
  async function makeDoc(fill = '#000') {
    W.newDocTab(300, 200, '#ffffff', 'Masks'); W.selectTool('move'); W.setColor('fg', '#000000');
    const c = W.mkCanvas(300, 200), g = W.cx(c); g.fillStyle = fill; g.fillRect(0, 0, 300, 200);
    W.addLayer({ name: 'Ink', canvas: c }, 'Add Ink');
    return W.activeLayer();
  }
  /** Replaces the active layer's mask canvas with one drawn by paint(g). */
  function setMaskCanvas(paint, def, label = 'Paint Mask') {
    const L = W.activeLayer(), c = W.mkCanvas(300, 200), g = W.cx(c); paint(g);
    W.setLayerProps(L.id, { mask: Object.assign({}, L.mask || { x: 0, y: 0, enabled: true }, { canvas: c, def: def }) }, label);
  }
  /** [r,g,b,a] of a canvas at (x, y). */
  const pixel = (c, x, y) => [...c.getContext('2d', { willReadFrequently: true }).getImageData(x, y, 1, 1).data];
  const layerNamed = (n) => W.D.layers.find((l) => l.name === n);

  describe('Layer masks', () => {
    it('boots', async () => {
      win = document.getElementById('app').contentWindow;
      await waitFor(() => win.document && win.document.body && win.document.body.classList.contains('ready'), { timeout: 30000 });
      W = new Proxy({}, { get: (_, k) => win.eval(String(k)) });
      expect(typeof W.addMask).toBe('function');
      expect(typeof W.invertMask).toBe('function');
      expect(typeof W.setClipping).toBe('function');
      expect(typeof W.selectSubject).toBe('function');
    }, { timeout: 40000 });

    it('Reveal All and Hide All add a mask, one undo step each; the composite follows', async () => {
      await makeDoc(); let n = W.Hist.idx;
      W.addMask('reveal');
      expect(W.activeLayer().mask.def).toBe(false);
      expect(colorAt(150, 100)[0]).toBe(0);
      expect(W.Hist.idx).toBe(n + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Add Layer Mask');
      W.undo(); expect(W.activeLayer().mask).toBe(null); W.redo();
      await makeDoc(); W.addMask('hide');
      expect(W.activeLayer().mask.def).toBe(true);
      expect(colorAt(150, 100)[0]).toBe(255);
    });

    it('Reveal Selection keeps only the selected area visible', async () => {
      await makeDoc();
      W.selectShape((g) => g.fillRect(50, 50, 100, 60));
      W.addMask('sel');
      const L = W.activeLayer();
      expect(maskAt(L, 100, 80)).toBe(255);
      expect(maskAt(L, 10, 10)).toBe(0);
      expect(W.D.sel).toBe(null);
      expect(colorAt(100, 80)[0]).toBe(0);
      expect(colorAt(10, 10)[0]).toBe(255);
    });

    it('the brush paints on the mask: white reveals, black hides', async () => {
      await makeDoc(); W.addMask('hide'); W.UI.editMask = true;
      W.selectTool('brush'); W.eval('T.brush.size = 30; T.brush.pressure = false');
      W.setColor('fg', '#ffffff'); drag({ x: 60, y: 50 }, { x: 120, y: 50 }); await sleep(60);
      expect(maskAt(W.activeLayer(), 90, 50)).toBeGreaterThan(200);
      expect(colorAt(90, 50)[0]).toBe(0);
      W.setColor('fg', '#000000'); drag({ x: 60, y: 50 }, { x: 120, y: 50 }); await sleep(60);
      expect(maskAt(W.activeLayer(), 90, 50)).toBeLessThan(60);
      expect(colorAt(90, 50)[0]).toBe(255);
    });

    it('Invert Mask swaps shown and hidden in one step, and undoes', async () => {
      await makeDoc(); W.addMask('reveal');
      setMaskCanvas((g) => { g.fillStyle = '#000'; g.fillRect(0, 0, 150, 200); }, false);
      expect(colorAt(40, 100)[0]).toBe(0);
      expect(colorAt(200, 100)[0]).toBe(255);
      const n = W.Hist.idx;
      run('Layer', 'Mask', 'Invert');
      expect(W.Hist.idx).toBe(n + 1);
      expect(colorAt(40, 100)[0]).toBe(255);
      expect(colorAt(200, 100)[0]).toBe(0);
      W.undo(); expect(colorAt(40, 100)[0]).toBe(0); W.redo();
    });

    it('Disable / Enable Mask toggles the mask, one step each; Delete Mask removes it', async () => {
      await makeDoc(); W.addMask('hide');
      setMaskCanvas((g) => { g.fillStyle = '#000'; g.fillRect(0, 0, 150, 200); }, false);
      expect(colorAt(40, 100)[0]).toBe(0);
      const n = W.Hist.idx;
      run('Layer', 'Mask', 'Disable');
      expect(W.activeLayer().mask.enabled).toBe(false);
      expect(colorAt(200, 100)[0]).toBe(0);
      expect(W.Hist.idx).toBe(n + 1);
      run('Layer', 'Mask', 'Disable');
      expect(colorAt(200, 100)[0]).toBe(255);
      run('Layer', 'Mask', 'Delete');
      expect(W.activeLayer().mask).toBe(null);
      W.undo(); expect(!!W.activeLayer().mask).toBe(true);
    });

    it('Apply Mask bakes the mask into the pixels and removes it', async () => {
      await makeDoc('#ff0000'); W.addMask('hide');
      setMaskCanvas((g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 100, 200); }, false);
      run('Layer', 'Mask', 'Apply');
      expect(W.activeLayer().mask).toBe(null);
      expect(colorAt(50, 100)).toEqual([255, 0, 0, 255]);
      expect(colorAt(200, 100)[0]).toBe(255);
      expect(colorAt(200, 100)[1]).toBe(255);
    });

    it('the mask survives saving to PSD and reading back', async () => {
      await makeDoc(); W.selectShape((g) => g.fillRect(0, 0, 100, 200)); W.addMask('sel');
      W.setLayerProps(W.activeLayer().id, { name: 'Masked' }, 'Rename');
      const doc = await W.readPSD(W.writePSD().buffer);
      const L = doc.layers.find((l) => l.name === 'Masked');
      expect(!!L.mask).toBe(true);
      expect(maskAt(L, 50, 100)).toBe(255);
      expect(maskAt(L, 250, 100)).toBe(0);
    }, { timeout: 30000 });
  });

  describe('Clipping masks', () => {
    /** White page; 'Base' is a red square at 60..180 × 40..120; 'Top' is black over the whole page. */
    async function makeClip() {
      await makeDoc('#ffffff');
      const c = W.mkCanvas(300, 200), g = W.cx(c); g.fillStyle = '#f00'; g.fillRect(60, 40, 120, 80);
      W.addLayer({ name: 'Base', canvas: c }, 'Add Base');
      const t = W.mkCanvas(300, 200), tg = W.cx(t); tg.fillStyle = '#000'; tg.fillRect(0, 0, 300, 200);
      W.addLayer({ name: 'Top', canvas: t }, 'Add Top');
      return layerNamed('Top');
    }

    it('a clipped layer shows only where the layer below is opaque, and releases again', async () => {
      await makeClip();
      expect(colorAt(10, 10)[0]).toBe(0);
      const n = W.Hist.idx;
      W.setClipping(layerNamed('Top').id, true);
      expect(W.Hist.idx).toBe(n + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Create Clipping Mask');
      expect(colorAt(10, 10)[0]).toBe(255);
      expect(colorAt(100, 80)).toEqual([0, 0, 0, 255]);
      W.undo(); expect(!!layerNamed('Top').clip).toBe(false); W.redo();
      W.setClipping(layerNamed('Top').id, false);
      expect(colorAt(10, 10)[0]).toBe(0);
    });

    it('the bottom layer cannot clip; a clipped layer hides with its base', async () => {
      await makeClip();
      const bottom = W.D.layers[0];
      W.setClipping(bottom.id, true);
      expect(!!bottom.clip).toBe(false);
      W.setClipping(layerNamed('Top').id, true);
      W.setLayerProps(layerNamed('Base').id, { visible: false }, 'Hide');
      expect(colorAt(100, 80)[0]).toBe(255);
      expect(colorAt(10, 10)[0]).toBe(255);
    });

    it('Alt-click on a layer row toggles its clipping mask', async () => {
      await makeClip();
      const row = [...win.document.querySelectorAll('.layers li.layer')].find((r) => r.querySelector('.lp-name').textContent.includes('Top'));
      const rect = row.getBoundingClientRect();
      row.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, altKey: true, clientX: rect.left + 5, clientY: rect.top + 5 }));
      expect(layerNamed('Top').clip).toBe(true);
      const again = [...win.document.querySelectorAll('.layers li.layer')].find((r) => r.querySelector('.lp-name').textContent.includes('Top'));
      expect(!!again.querySelector('.lp-clip')).toBe(true);
    });

    it('a clipped layer survives PSD save and read, and merging keeps the look', async () => {
      await makeClip(); W.setClipping(layerNamed('Top').id, true);
      const before = colorAt(100, 80), outside = colorAt(10, 10);
      const doc = await W.readPSD(W.writePSD().buffer);
      expect(doc.layers.find((l) => l.name === 'Top').clip).toBe(true);
      W.D.activeId = layerNamed('Top').id; W.mergeDown();
      expect(colorAt(100, 80)).toEqual(before);
      expect(colorAt(10, 10)).toEqual(outside);
    }, { timeout: 30000 });
  });

  describe('Select Subject and Layer via Cut', () => {
    /** A white page with a black disc at the centre (on its own layer, 'Scene'). */
    async function makeDisc() {
      await makeDoc('#ffffff');
      const c = W.mkCanvas(300, 200), g = W.cx(c); g.fillStyle = '#000'; g.beginPath(); g.arc(150, 100, 50, 0, Math.PI * 2); g.fill();
      W.addLayer({ name: 'Scene', canvas: c }, 'Add Scene');
    }
    it('Subject selects the disc (the vendored model), and Layer via Cut moves it to a new layer', async () => {
      await makeDisc();
      await W.selectSubject();
      expect(!!W.D.sel).toBe(true);
      expect(pixel(W.D.sel.mask, 150, 100)[3]).toBeGreaterThan(128);
      expect(pixel(W.D.sel.mask, 10, 10)[3]).toBeLessThan(128);
      const n = W.D.layers.length;
      run('Layer', 'Layer via Cut');
      expect(W.D.layers.length).toBe(n + 1);
      expect(pixel(layerNamed('Scene').canvas, 150 - layerNamed('Scene').x, 100 - layerNamed('Scene').y)[3]).toBe(0);
      expect(pixel(W.activeLayer().canvas, 150 - W.activeLayer().x, 100 - W.activeLayer().y)[3]).toBeGreaterThan(128);
    }, { timeout: 60000 });
    it('without the model, Subject falls back to the colour difference from the border', async () => {
      await makeDisc();
      const saved = win.SlopCutout; win.SlopCutout = null;
      try { await W.selectSubject(); } finally { win.SlopCutout = saved; }
      expect(!!W.D.sel).toBe(true);
      expect(pixel(W.D.sel.mask, 150, 100)[3]).toBeGreaterThan(128);
      expect(pixel(W.D.sel.mask, 10, 10)[3]).toBeLessThan(128);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Select Subject');
    }, { timeout: 30000 });
  });
  describe('Mask menus, panel button and live painting', () => {
    const doc = () => win.document;
    const menuLabels = () => [...doc().querySelectorAll('.sui-menu .sui-lbl')].map((x) => x.textContent);
    const clickRow = (label) => { const row = [...doc().querySelectorAll('.sui-menu .sui-row')].find((r) => r.querySelector('.sui-lbl').textContent === label); expect(!!row).toBe(true); row.click(); };
    const sel = (fn) => { W.selectShape(fn); };
    /** Doc point to viewport client point. */
    const at = (p) => { const el = W.eval('V.el'), r = el.getBoundingClientRect(), s = W.eval(`toScreen(${p.x}, ${p.y})`); return { el, x: r.left + s.x, y: r.top + s.y }; };
    const pe = (type, p) => new win.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: p.x, clientY: p.y });

    it('the Mask submenu lists Add (with the three options), Delete, Invert, Apply and Disable', async () => {
      await makeDoc();
      const mask = menuItem('Layer', 'Mask');
      expect(mask.sub.map((x) => x.label)).toEqual(['Add', 'Delete', 'Invert', 'Apply', 'Disable']);
      expect(mask.sub[0].sub.map((x) => x.label)).toEqual(['Reveal All', 'Hide All', 'From Selection']);
    });

    it('the right-click menu of a layer offers Add layer mask with the same options', async () => {
      await makeDoc();
      const row = doc().querySelector('.layers li.layer.active');
      const r = row.getBoundingClientRect();
      row.dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: r.left + 5, clientY: r.top + 5 }));
      const top = [...doc().querySelectorAll('.sui-menu .sui-row')].find((x) => x.querySelector('.sui-lbl').textContent === 'Add layer mask');
      expect(!!top).toBe(true);
      top.dispatchEvent(new win.MouseEvent('pointerenter', { bubbles: true }));
      top.focus(); top.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
      const flyout = doc().querySelectorAll('.sui-menu')[1];
      expect(flyout ? [...flyout.querySelectorAll('.sui-lbl')].map((x) => x.textContent) : []).toEqual(['Reveal All', 'Hide All', 'From Selection']);
      win.SlopUI.closeMenu();
    });

    it('the panel mask button with a selection: From Selection makes the mask, one undo step, and the thumbnail appears', async () => {
      await makeDoc();
      sel((g) => g.fillRect(50, 50, 100, 60));
      const n = W.Hist.idx;
      doc().querySelector('button[aria-label="Add layer mask"]').click();
      clickRow('From Selection');
      expect(!!W.activeLayer().mask).toBe(true);
      expect(W.D.sel).toBe(null);
      expect(maskAt(W.activeLayer(), 100, 80)).toBe(255);
      expect(maskAt(W.activeLayer(), 10, 10)).toBe(0);
      expect(W.Hist.idx).toBe(n + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Add Layer Mask');
      await sleep(30);
      expect(!!doc().querySelector('.layers .lp-thumb.mask')).toBe(true);
      W.undo(); expect(!!W.activeLayer().mask).toBe(false); W.redo();
      expect(!!W.activeLayer().mask).toBe(true);
    });

    it('From Selection needs a selection: the menu item is disabled without one', async () => {
      await makeDoc(); W.deselect && W.D.sel && W.deselect();
      W.D.sel = null;
      doc().querySelector('button[aria-label="Add layer mask"]').click();
      const row = [...doc().querySelectorAll('.sui-menu .sui-row')].find((r) => r.querySelector('.sui-lbl').textContent === 'From Selection');
      expect(row.disabled).toBe(true);
      win.SlopUI.closeMenu();
    });

    it('painting on the mask updates the canvas during the stroke, before the mouse is released', async () => {
      await makeDoc(); W.addMask('hide'); W.UI.editMask = true;
      W.selectTool('brush'); W.eval('T.brush.size = 30; T.brush.pressure = false; T.brush.hardness = 1');
      W.setColor('fg', '#ffffff');
      const a = at({ x: 60, y: 50 }), b = at({ x: 120, y: 50 }), c = at({ x: 150, y: 50 });
      a.el.dispatchEvent(pe('pointerdown', a));
      a.el.dispatchEvent(pe('pointermove', b));
      await sleep(80);
      // still held down: the viewport shows the stroke (the layer is revealed where it has been painted)
      expect(pixel(W.V.comp, 90, 50)[0]).toBe(0);
      expect(pixel(W.V.comp, 20, 100)[0]).toBe(255);
      a.el.dispatchEvent(pe('pointermove', c));
      a.el.dispatchEvent(pe('pointerup', c));
      await sleep(40);
      expect(maskAt(W.activeLayer(), 90, 50)).toBeGreaterThan(200);
      expect(colorAt(90, 50)[0]).toBe(0);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Brush');
      W.UI.editMask = false;
    }, { timeout: 30000 });
  });
  describe('Menu bar submenus', () => {
    it('a menu-bar submenu opens beside its row, to the right of the menu, and Escape closes it first', async () => {
      await makeDoc();
      const bar = [...win.document.querySelectorAll('.mb-item')].find((b) => b.textContent === 'Layer');
      bar.dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0 }));
      const parent = win.document.querySelector('.menu'), row = [...parent.querySelectorAll('.menu-row')].find((r) => r.querySelector('.menu-label').textContent === 'Mask');
      expect(!!row).toBe(true);
      row.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
      const menus = win.document.querySelectorAll('.menu');
      expect(menus.length).toBe(2);
      expect(menus[1].getBoundingClientRect().left >= parent.getBoundingClientRect().right).toBe(true);
      menus[1].querySelector('.menu-row').dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      expect(win.document.querySelectorAll('.menu').length).toBe(1);
      win.SlopUI.closeMenu();
      win.document.querySelectorAll('.menu').forEach((m) => m.remove());
    });
  });
  SlopTest.run({ name: 'PhotoSlop masks and clipping' });
  </script>
</body>
</html>
