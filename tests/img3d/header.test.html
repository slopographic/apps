<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Image to 3D: the header (1440 and 390 wide)</title></head>
<body>
  <!-- Covers: img3d/index.html, img3d/css/img3d.css -->
  <script>try { localStorage.setItem('slop-firstrun:img3d', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  /** The app in a frame of the given width, once brand.js has put the app's icon in the brand link. */
  async function open(width) {
    const f = document.createElement('iframe');
    f.style.cssText = `width:${width}px;height:800px;border:0;display:block`;
    f.src = '../../img3d/?t=' + Date.now();
    document.body.append(f);
    await waitFor(() => f.contentDocument && f.contentDocument.querySelector('header a.brand .brand-app') && f.contentDocument.querySelector('header .stour-btn'), { timeout: 15000 });
    return f;
  }
  const box = (D, s) => D.querySelector(s).getBoundingClientRect();

  describe('Slop Image to 3D header', () => {
    it('has the brand home link with the app icon, then the app name', async () => {
      const f = await open(1440), D = f.contentDocument;
      const brand = D.querySelector('header.topbar > a.brand');
      expect(brand.getAttribute('href')).toBe('../');
      expect(brand.getAttribute('aria-label')).toBe('Slopographic home');
      expect(box(D, 'header a.brand .brand-tile').width).toBe(26);
      expect(brand.nextElementSibling.textContent).toBe('Slop Image to 3D');
      f.remove();
    });
    it('keeps one row at 1440px, Tour at the height of the toolbar buttons', async () => {
      const f = await open(1440), D = f.contentDocument;
      expect(box(D, 'header.topbar').height).toBeLessThan(50);
      expect(box(D, 'header .stour-btn').height).toBe(box(D, '#btnDrive').height);
      f.remove();
    });
    it('fits 390px: brand, name and Tour on the first row, no sideways scroll', async () => {
      const f = await open(390), D = f.contentDocument;
      expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(390);
      expect(Math.abs(box(D, 'header .stour-btn').top - box(D, 'header a.brand').top)).toBeLessThan(6);
      expect(box(D, '#btnDrive').top).toBeGreaterThan(box(D, 'header a.brand').bottom - 1);
      f.remove();
    });
  });
  SlopTest.run({ name: 'Slop Image to 3D: header' });
  </script>
</body>
</html>
