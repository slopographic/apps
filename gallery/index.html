<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
      </a>
      <div class="appname"><b>Slop Gallery</b><a class="home-link" href="../">slopographic</a></div>
      <button type="button" class="tb-btn tb-filters" id="btnFilters" aria-expanded="false" aria-controls="side">Filters</button>
      <div class="tb-group">
        <button type="button" class="tb-btn primary" id="topImport" title="Import photos (Ctrl+O)">Import</button>
        <button type="button" class="tb-btn" id="topSort" title="Sort photos (Alt+S)">Sort</button>
        <button type="button" class="tb-btn" id="btnSelectMode" aria-pressed="false" title="Select photos with a click">Select</button>
        <button type="button" class="tb-btn" id="topReel" title="Make a reel from the selected photos" hidden>Make reel</button>
        <button type="button" class="tb-btn" id="btnActions" aria-haspopup="menu" title="More actions">Actions</button>
      </div>
      <span class="tb-flex"></span>
      <span class="local-badge" title="Your photos are processed on this device. Nothing is uploaded."><span>100% local</span></span>
    </header>

    <div class="body">
      <aside class="side" id="side" aria-label="Library">
        <nav class="nav" id="sideNav" aria-label="Views">
          <button type="button" class="nav-item" data-view="photos"><span class="nav-l">Photos</span><span class="nav-n" id="cntAll">0</span></button>
          <button type="button" class="nav-item" data-view="favourites"><span class="nav-l">Favourites</span><span class="nav-n" id="cntFav">0</span></button>
          <button type="button" class="nav-item" data-view="dupes"><span class="nav-l">Duplicates</span><span class="nav-n" id="cntDupes"></span></button>
          <button type="button" class="nav-item" data-view="people"><span class="nav-l">People</span></button>
        </nav>

        <div class="side-sec" id="secAlbums">
          <div class="side-h"><h2>Albums</h2><button type="button" class="link" id="btnNewAlbum">New album</button></div>
          <ul class="albums" id="albumList"></ul>
          <p class="muted" id="albumEmpty">No albums yet. An album links to photos; it never copies them.</p>
        </div>

        <div class="side-sec" id="secFilters">
          <h2>Filters</h2>
          <label class="fld"><span>Name</span><input id="fText" type="search" placeholder="Search by file name" autocomplete="off"></label>
          <label class="fld"><span>Year</span><select id="fYear"><option value="">All years</option></select></label>
          <label class="fld"><span>Month</span><select id="fMonth"></select></label>
          <label class="fld"><span>Camera</span><select id="fCamera"><option value="">All cameras</option></select></label>
          <label class="fld"><span>Tag</span><select id="fTag">
            <option value="">Any tag</option><option value="liked">Liked only</option><option value="disliked">Disliked only</option><option value="untagged">Untagged only</option>
          </select></label>
          <button type="button" class="link" id="btnClearFilters">Clear filters</button>
        </div>

        <div class="side-sec">
          <h2>Library</h2>
          <button type="button" class="side-btn" id="btnImport">Import photos…</button>
          <button type="button" class="side-btn" id="btnFolder">Import a folder…</button>
          <button type="button" class="side-btn" id="btnDrive">From Slop Drive…</button>
          <label class="check"><input type="checkbox" id="keepDup"><span>Keep exact duplicates on import</span></label>
          <button type="button" class="side-btn" id="btnSort">Sort photos (swipe deck)</button>
          <button type="button" class="side-btn" id="btnDupes">Find duplicates…</button>
          <button type="button" class="side-btn" id="btnBackup">Back up the whole library</button>
          <button type="button" class="side-btn" id="btnRestore">Restore from a backup…</button>
        </div>
      </aside>

      <main class="grid-area">
        <div class="srcbar">
          <div class="seg" role="group" aria-label="Source">
            <button type="button" class="seg-btn" id="srcLibrary" aria-pressed="true">Library</button>
            <button type="button" class="seg-btn" id="srcDrive" aria-pressed="false">Drive</button>
          </div>
          <div class="dbar" id="dbar" hidden>
            <div class="chips" id="dchips" role="group" aria-label="File kinds"></div>
            <div class="dtools">
              <input type="search" id="dSearch" placeholder="Search by name" autocomplete="off" aria-label="Search Slop Drive files">
              <select id="dSort" aria-label="Sort Slop Drive files"><option value="added">Date added</option><option value="name">Name</option></select>
              <span class="dcount" id="dCount"></span>
              <button type="button" class="link" id="dClear">Clear</button>
            </div>
          </div>
        </div>
        <div class="people-bar" id="peopleBar" hidden>
          <p class="people-text" id="peopleText" aria-live="polite"></p>
          <p class="people-status muted" id="peopleStatus" aria-live="polite"></p>
          <progress class="people-prog" id="peopleProg" hidden></progress>
          <div class="people-acts">
            <button type="button" class="tb-btn" id="peopleOn" hidden>Turn on face detection…</button>
            <button type="button" class="tb-btn" id="peopleGo" hidden>Find faces</button>
            <button type="button" class="tb-btn" id="peopleStop" hidden>Stop</button>
            <label class="people-mode">Show faces <select id="peopleMode" class="set-select"><option value="off">Off</option><option value="boxes">Boxes on photos</option><option value="count">Count only</option></select></label>
            <button type="button" class="tb-btn" id="peopleAll">Faces and people…</button>
          </div>
        </div>
        <div id="gDrop" class="g-dropstrip"></div>
        <div class="grid" id="grid" tabindex="0" aria-label="Photos, newest first">
          <div class="sticky" id="sticky" hidden><span class="sticky-l"></span><span class="sticky-n"></span></div>
          <div class="tl-content" id="tlContent"></div>
          <div class="empty" id="empty" hidden>
            <div class="g-intro" id="emptyIntro" data-empty-intro></div>
            <p data-empty-text></p>
            <div class="g-empty-acts">
              <button type="button" class="tb-btn primary" id="emptyImport">Import photos</button>
              <button type="button" class="sd-sample" id="emptySample" data-empty-intro>Try it with 8 sample photos</button>
            </div>
          </div>
        </div>
        <div class="dgrid" id="dgrid" hidden>
          <div class="dtiles" id="dtiles"></div>
          <div class="empty" id="dempty" hidden><p id="dEmptyText"></p></div>
        </div>
        <div class="astrip" id="astrip" hidden>
          <span class="astrip-n" id="astripName"></span>
          <audio id="astripAudio" controls preload="auto"></audio>
          <button type="button" class="link" id="astripClose">Close</button>
        </div>
      </main>
    </div>

    <footer class="statusbar"><span id="status" aria-live="polite"></span><span class="busy" id="busy" hidden></span></footer>
  </div>
