<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
      </a>
      <div class="appname"><b>Slop Tables</b><a class="home-link" href="../">slopographic</a></div>
      <nav class="menus" id="menus" aria-label="Main menu"></nav>
      <div class="tb-group">
        <button type="button" class="tb" id="btnUndo" aria-label="Undo" title="Undo" disabled>↶</button>
        <button type="button" class="tb" id="btnRedo" aria-label="Redo" title="Redo" disabled>↷</button>
        <button type="button" class="tb" id="btnBold" aria-label="Bold" title="Bold (Ctrl+B)" aria-pressed="false"><b>B</b></button>
        <button type="button" class="tb" id="btnItalic" aria-label="Italic" title="Italic (Ctrl+I)" aria-pressed="false"><i>I</i></button>
        <label class="nf-wrap"><span class="sr">Number format</span><select id="nf" class="nf" title="Number format"></select></label>
      </div>
      <span class="tb-flex"></span>
      <span class="local-badge" title="Your workbook is processed on this device. Nothing is uploaded."><span>100% local</span></span>
      <label class="fname"><span class="sr">Workbook name</span><input id="fileName" type="text" value="Untitled spreadsheet" spellcheck="false" autocomplete="off" aria-label="Workbook name"></label>
      <button type="button" class="btn primary" id="btnSave" title="Save to Slop Drive (Ctrl+S)">Save</button>
    </header>
    <div id="doc-tabs" class="doctabs-host"></div>

    <div class="fbar">
      <input id="namebox" class="namebox" type="text" spellcheck="false" autocomplete="off" aria-label="Name box" value="A1">
      <span class="fx-label" aria-hidden="true">fx</span>
      <input id="fx" class="fx" type="text" spellcheck="false" autocomplete="off" aria-label="Formula bar">
    </div>

    <div class="mid">
      <aside class="side" id="side" aria-label="Sidebar">
        <button type="button" class="side-toggle" id="sideToggle" aria-controls="sideBody" aria-expanded="true" aria-label="Hide sidebar" title="Hide sidebar">‹</button>
        <div class="side-body" id="sideBody">
          <section class="side-sec" aria-labelledby="secSheets">
            <h2 class="side-h" id="secSheets">Sheets</h2>
            <ul class="side-list" id="sideSheets"></ul>
            <button type="button" class="side-act" id="sideAddSheet">+ Add sheet</button>
          </section>
          <section class="side-sec" aria-labelledby="secTpl">
            <h2 class="side-h" id="secTpl">Templates</h2>
            <button type="button" class="side-act" id="sideFromTpl">From template…</button>
            <h3 class="side-sub">My templates</h3>
            <ul class="side-list" id="sideMine"></ul>
          </section>
          <section class="side-sec" aria-labelledby="secFn">
            <h2 class="side-h" id="secFn">Functions</h2>
            <input id="fnFilter" class="side-search" type="search" placeholder="Filter functions" aria-label="Filter functions" autocomplete="off" spellcheck="false">
            <ul class="side-list side-fns" id="sideFns"></ul>
          </section>
        </div>
      </aside>
    <main class="grid" id="grid" tabindex="0" aria-label="Spreadsheet grid" aria-multiselectable="true">
      <div class="corner" id="corner"></div>
      <div class="colhead" id="colhead"></div>
      <div class="rowhead" id="rowhead"></div>
      <div class="vp" id="vp"><div class="sizer" id="sizer"></div></div>
      <div class="plane" id="plane">
        <div id="cells"></div>
        <div class="selrect" id="selrect" hidden></div>
        <div class="cursor" id="cursor"></div>
        <input id="editor" class="editor" type="text" spellcheck="false" autocomplete="off" aria-label="Cell editor">
      </div>
    </main>
    </div>

    <div class="bottombar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Sheets"></div>
      <span class="status" id="status" aria-live="polite"></span>
      <span class="save-state" id="saveState"></span>
    </div>
  </div>
