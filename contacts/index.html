<!doctype html>
<html lang="en" data-theme="pro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slop Contacts — Slopographic</title>
  <meta name="description" content="Slop Contacts: import vCard and CSV, find and merge duplicates, clean up in bulk, and export for iOS, Android, Google or Outlook. Nothing is uploaded.">
  <meta name="theme-color" content="#0e0e10">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Slopographic">
  <meta property="og:title" content="Slop Contacts — Slopographic">
  <meta property="og:description" content="An address book that runs in your browser: vCard and CSV in and out, duplicates merged. Nothing is uploaded.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    try { var t = JSON.parse(localStorage.getItem('slop-contacts.theme')); if (t === 'light' || t === 'pro') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ }
  </script>
  <link rel="stylesheet" href="../shared/fonts/fonts.css" data-offline="strip">
  <link rel="stylesheet" href="../shared/slopui.css" data-src="shared/slopui.css">
  <link rel="stylesheet" href="../shared/commands/commands.css" data-src="shared/commands/commands.css">
  <link rel="stylesheet" href="css/contacts.css" data-src="contacts/css/contacts.css">
  <link rel="stylesheet" href="css/contacts-ui.css" data-src="contacts/css/contacts-ui.css">
  <script src="../shared/guard.js" defer data-offline="strip"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
      </a>
      <div class="appname"><b>Slop Contacts</b><a class="home-link" href="../">slopographic</a></div>
      <div class="actions" role="toolbar" aria-label="Contacts">
        <button type="button" class="tb-btn" data-cmd="contacts.new">New</button>
        <button type="button" class="tb-btn" data-cmd="import.files">Import</button>
        <button type="button" class="tb-btn" data-cmd="contacts.dupes">Duplicates</button>
        <button type="button" class="tb-btn" data-cmd="contacts.clean">Clean up</button>
        <button type="button" class="tb-btn" data-cmd="export.open">Export</button>
        <button type="button" class="tb-btn" id="ccBtn" data-cmd="settings.country" title="Default country code for phone numbers"><span id="ccLabel">No country code</span></button>
        <button type="button" class="btn primary" id="btnSave" data-cmd="file.save" title="Save to Slop Drive (Ctrl+S)">Save</button>
      </div>
      <span class="local-badge" title="Your contacts are processed on this device. Nothing is uploaded."><span>100% local</span></span>
      <label class="fname"><span class="sr">List name</span><input id="fileName" type="text" value="Contacts" spellcheck="false" autocomplete="off" aria-label="List name"></label>
    </header>

    <div class="shell">
      <aside class="side" aria-label="Groups">
        <h2 class="side-h">Groups</h2>
        <div id="groups" class="groups"></div>
        <p class="hint" id="groupHint"></p>
      </aside>

      <main class="main" id="main">
        <div class="tools">
          <label class="search"><span class="sr">Search contacts</span>
            <input id="search" type="search" placeholder="Search name, phone, e-mail, organisation" autocomplete="off" spellcheck="false"></label>
          <button type="button" class="tb-btn" id="btnSelAll" data-cmd="contacts.selectAll">Select all shown</button>
        </div>

        <div class="selbar" id="selBar" hidden>
          <span id="selCount" class="selcount"></span>
          <button type="button" class="tb-btn" data-cmd="groups.add">Add to group</button>
          <button type="button" class="tb-btn" data-cmd="groups.remove">Remove from group</button>
          <button type="button" class="tb-btn" data-cmd="contacts.findReplace">Find and replace</button>
          <button type="button" class="tb-btn" data-cmd="contacts.clean">Clean up</button>
          <button type="button" class="tb-btn" data-cmd="export.open">Export</button>
          <button type="button" class="tb-btn danger" data-cmd="contacts.delete">Delete</button>
          <button type="button" class="tb-btn" data-cmd="contacts.clearSel">Clear</button>
        </div>

        <p class="status" id="count" aria-live="polite"></p>
        <ul id="rows" class="rows" aria-label="Contacts"></ul>
        <p id="noMatch" class="empty" hidden>No contact matches that search.</p>
        <div class="empty" id="empty">
          <p class="empty-h">No contacts yet</p>
          <p>Import a vCard (.vcf) or a CSV from Google, Outlook or Apple. Your list stays in this browser until you save it to Slop Drive.</p>
          <div class="empty-acts">
            <button type="button" class="btn primary" data-cmd="import.files">Import contacts</button>
            <button type="button" class="tb-btn" data-cmd="contacts.new">New contact</button>
          </div>
        </div>
      </main>
    </div>

    <footer class="bottombar">
      <span class="save-state" id="saveState" aria-live="polite"></span>
    </footer>
  </div>

  <script src="../shared/slopui.js" data-src="shared/slopui.js"></script>
  <script src="../shared/apps.js" data-src="shared/apps.js"></script>
  <script src="../shared/commands/commands.js" data-src="shared/commands/commands.js"></script>
  <script src="../shared/hub.js" data-src="shared/hub.js"></script>
  <script src="js/core/text.js" data-src="contacts/js/core/text.js"></script>
  <script src="js/core/model.js" data-src="contacts/js/core/model.js"></script>
  <script src="js/core/phone.js" data-src="contacts/js/core/phone.js"></script>
  <script src="js/core/vcard-read.js" data-src="contacts/js/core/vcard-read.js"></script>
  <script src="js/core/vcard-write.js" data-src="contacts/js/core/vcard-write.js"></script>
  <script src="js/core/csv-read.js" data-src="contacts/js/core/csv-read.js"></script>
  <script src="js/core/csv-write.js" data-src="contacts/js/core/csv-write.js"></script>
  <script src="js/core/dedupe.js" data-src="contacts/js/core/dedupe.js"></script>
  <script src="js/core/bulk.js" data-src="contacts/js/core/bulk.js"></script>
  <script src="js/core/zip.js" data-src="contacts/js/core/zip.js"></script>
  <script src="js/core/format.js" data-src="contacts/js/core/format.js"></script>
  <script src="js/store/drafts.js" data-src="contacts/js/store/drafts.js"></script>
  <script src="js/app/state.js" data-src="contacts/js/app/state.js"></script>
  <script src="js/app/list.js" data-src="contacts/js/app/list.js"></script>
  <script src="js/app/editor.js" data-src="contacts/js/app/editor.js"></script>
  <script src="js/app/io-dialogs.js" data-src="contacts/js/app/io-dialogs.js"></script>
  <script src="js/app/tools-dialogs.js" data-src="contacts/js/app/tools-dialogs.js"></script>
  <script src="js/app/storage.js" data-src="contacts/js/app/storage.js"></script>
  <script src="js/app/commands.js" data-src="contacts/js/app/commands.js"></script>
  <script src="js/app/main.js" data-src="contacts/js/app/main.js"></script>
</body>
</html>
