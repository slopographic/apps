<body>
  <div class="fx-app" id="fx-app">
    <header class="fx-top">
      <a class="fx-brand" href="../" aria-label="Slopographic home">Slop Effects</a>
      <input class="fx-name sui-input" id="fx-name" type="text" value="Untitled" aria-label="Project name" maxlength="120">
      <div class="fx-tools" role="toolbar" aria-label="Project">
        <button type="button" class="sui-btn" id="fx-undo" title="Undo">Undo</button>
        <button type="button" class="sui-btn" id="fx-redo" title="Redo">Redo</button>
        <button type="button" class="sui-btn" id="fx-file">File</button>
        <button type="button" class="sui-btn" id="fx-comp">Composition</button>
        <button type="button" class="sui-btn" id="fx-layer">Layer</button>
        <button type="button" class="sui-btn sui-primary" id="fx-render">Render</button>
        <button type="button" class="sui-btn" id="fx-search" title="Search commands (Ctrl+K)">Search</button>
      </div>
    </header>
    <main class="fx-main">
      <section class="fx-stage" aria-label="Preview">
        <div class="fx-view" id="fx-view"><canvas id="fx-canvas" aria-label="Preview of the composition"></canvas></div>
        <div class="fx-transport" id="fx-transport"></div>
      </section>
      <aside class="fx-side" aria-label="Properties">
        <nav class="fx-tabs" role="tablist" id="fx-tabs">
          <button type="button" role="tab" data-tab="layer" aria-selected="true">Layer</button>
          <button type="button" role="tab" data-tab="fx" aria-selected="false">Effects</button>
          <button type="button" role="tab" data-tab="motion" aria-selected="false">Motion</button>
        </nav>
        <div class="fx-panel" id="fx-panel" role="tabpanel"></div>
      </aside>
      <section class="fx-tl" aria-label="Timeline">
        <nav class="fx-tabs" role="tablist" id="fx-tl-tabs">
          <button type="button" role="tab" data-tl="timeline" aria-selected="true">Timeline</button>
          <button type="button" role="tab" data-tl="graph" aria-selected="false">Graph editor</button>
        </nav>
        <div id="fx-timeline" class="fx-timeline"></div>
        <div id="fx-graph" class="fx-graph" hidden></div>
      </section>
    </main>
    <div class="fx-status" id="fx-status" role="status" aria-live="polite"></div>
  </div>
