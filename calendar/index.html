<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <a id="cAbout" href="about/">About</a>
      <button type="button" class="tb-btn" id="cCmd" data-cmd="cmd.palette" aria-label="Search commands" title="Search commands (Ctrl+K)">⌘K</button>
    </div>


    <div class="toolbar" role="toolbar" aria-label="Calendar">
      <span class="local-badge" title="Your calendar stays in this browser. Nothing is uploaded."><span>100% local</span></span>
      <button type="button" class="btn" id="cPrev" aria-label="Previous period" title="Previous (Left arrow)">‹</button>
      <button type="button" class="btn" id="cToday" title="Today (T)">Today</button>
      <button type="button" class="btn" id="cNext" aria-label="Next period" title="Next (Right arrow)">›</button>
      <h2 id="cTitle" aria-live="polite"></h2>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="year" aria-pressed="false" title="Year (Y)">Year</button>
        <button type="button" data-view="month" aria-pressed="true" title="Month (M)">Month</button>
        <button type="button" data-view="week" aria-pressed="false" title="Week (W)">Week</button>
        <button type="button" data-view="day" aria-pressed="false" title="Day (D)">Day</button>
        <button type="button" data-view="split" aria-pressed="false" title="Split (S)">Split</button>
        <button type="button" data-view="agenda" aria-pressed="false" title="Agenda (A)">Agenda</button>
      </div>
      <select id="cSplit" hidden aria-label="Panes in the split view" title="The two panes of the split view">
        <option value="month-day">Month and day</option>
        <option value="month-week">Month and week</option>
        <option value="week-day">Week and day</option>
      </select>
      <label><input type="checkbox" id="cTasks"> To-dos</label>
      <label><span class="tb-lbl">Show times in</span> <select id="cZone" aria-label="Show times in this time zone"></select></label>
      <button type="button" class="btn primary" id="cNew" title="New event (N)">New event</button>
      <button type="button" class="btn" id="cImport">Import .ics</button>
      <button type="button" class="btn" id="cExport">Export .ics</button>
      <button type="button" class="btn" id="cConfig" aria-haspopup="menu">Config</button>
    </div>

    <main class="main" id="main">
      <p id="cNote" class="note" role="status"></p>
      <div id="cBoot" class="empty" role="status">Opening your calendar…</div>
      <div id="cView"></div>
    </main>
  </div>
