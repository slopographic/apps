  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5.5v13L9.5 12z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5.5v13L14.5 12z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c3 0 4 2 5 5s2 5 5 5h3M4 17h3c1.3 0 2.3-.5 3-1.4M14 7h6M17 4l3 3-3 3M17 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M5 11V9a3 3 0 0 1 3-3h10M16 3l3 3-3 3M19 13v2a3 3 0 0 1-3 3H6M8 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M5 11V9a3 3 0 0 1 3-3h10M16 3l3 3-3 3M19 13v2a3 3 0 0 1-3 3H6M8 21l-3-3 3-3M12 9.5v5M10.5 10.5l1.5-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7M18 15v6M18 15l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <header class="mu-top">
    <div class="mu-brand"><a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a><h1>Slop Music</h1></div>
    <nav class="mu-tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="library" aria-selected="true" tabindex="0">Library</button>
      <button type="button" role="tab" data-view="playlists" aria-selected="false" tabindex="-1">Playlists</button>
      <button type="button" role="tab" data-view="now" aria-selected="false" tabindex="-1">Now playing</button>
    </nav>
    <div class="mu-tools"><button type="button" class="sui-btn" id="mu-add">Add files…</button></div>
  </header>

  <main class="mu-main">
    <section class="mu-view" id="v-library" aria-label="Library">
      <div class="mu-lib">
        <aside class="mu-side" id="lib-side" aria-label="Tags"></aside>
        <div class="mu-lib-main">
          <div id="lib-drop" class="mu-dropzone"></div>
          <div class="mu-bar">
            <input type="search" id="lib-search" class="sui-input" placeholder="Search title, artist, album" aria-label="Search the library">
            <select id="lib-sort" class="sui-input" aria-label="Sort by">
              <option value="artist">Sort: artist</option>
              <option value="album">Sort: album</option>
              <option value="title">Sort: title</option>
            </select>
          </div>
          <p class="mu-stat" id="lib-stat" aria-live="polite"></p>
          <ul class="mu-list" id="lib-list" aria-label="Tracks"></ul>
          <div class="mu-empty" id="lib-empty">
            <h2>No audio in Slop Drive yet</h2>
            <div id="lib-preview"></div>
            <p>Add MP3, WAV, Ogg, FLAC, AAC or Opus files, or drop them here. They are saved to Slop Drive on this device.</p>
            <div class="mu-empty-acts">
              <button type="button" class="sui-btn sui-primary" id="lib-add-empty">Add files…</button>
              <button type="button" class="sd-sample" id="lib-sample">Try it with 3 sample tracks</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="mu-view" id="v-playlists" aria-label="Playlists" hidden>
      <div class="mu-pl">
        <aside class="mu-pl-side">
          <div class="mu-bar">
            <button type="button" class="sui-btn sui-primary" id="pl-new">New playlist</button>
            <button type="button" class="sui-btn" id="pl-open">Open from Drive…</button>
          </div>
          <ul class="mu-list" id="pl-list" aria-label="Playlists"></ul>
          <p class="mu-fine" id="pl-empty">No playlists yet.</p>
        </aside>
        <div class="mu-pl-detail" id="pl-detail"></div>
      </div>
    </section>

    <section class="mu-view mu-now-view" id="v-now" aria-label="Now playing" hidden>
      <div class="mu-now">
        <div class="mu-cover" id="now-cover"></div>
        <div class="mu-now-info">
          <h2 id="now-title">Nothing playing</h2>
          <p class="mu-artist" id="now-artist"></p>
          <p class="mu-fine" id="now-album"></p>
          <div class="mu-wave-wrap">
            <canvas id="now-wave" class="mu-wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas>
            <div class="mu-times"><span id="now-cur">0:00</span><span id="now-dur">—</span></div>
          </div>
          <div class="mu-controls">
            <button type="button" class="mu-btn" id="now-shuffle" aria-label="Shuffle" aria-pressed="false"><svg class="mu-ic"><use href="#i-shuffle"/></svg></button>
            <button type="button" class="mu-btn" id="now-prev" aria-label="Previous"><svg class="mu-ic"><use href="#i-prev"/></svg></button>
            <button type="button" class="mu-btn mu-big" id="now-play" aria-label="Play"><svg class="mu-ic"><use href="#i-play"/></svg></button>
            <button type="button" class="mu-btn" id="now-next" aria-label="Next"><svg class="mu-ic"><use href="#i-next"/></svg></button>
            <button type="button" class="mu-btn" id="now-repeat" aria-label="Repeat: off" data-mode="off"><svg class="mu-ic"><use href="#i-repeat"/></svg></button>
          </div>
          <div class="mu-sub-controls">
            <button type="button" class="mu-btn" id="now-mute" aria-label="Mute"><svg class="mu-ic"><use href="#i-vol"/></svg></button>
            <input type="range" id="now-vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
            <label class="mu-rate">Speed <select id="now-rate" class="sui-input" aria-label="Playback speed">
              <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
            </select></label>
            <button type="button" class="sui-btn" id="now-queue" aria-expanded="false"><svg class="mu-ic"><use href="#i-queue"/></svg> Queue</button>
          </div>
          <p class="mu-err" id="now-err" role="status"></p>
          <div class="mu-tag-edit">
            <h3>Tags</h3>
            <div class="mu-tags" id="now-tags"></div>
            <div class="mu-tag-add"><input type="text" id="now-tag-input" class="sui-input" placeholder="Add a tag" aria-label="Add a tag" maxlength="40"><button type="button" class="sui-btn" id="now-tag-add">Add</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <aside class="mu-sheet" id="queue-sheet" aria-label="Queue" hidden>
    <div class="mu-sheet-head"><h2>Queue</h2><button type="button" class="sui-x" id="queue-close" aria-label="Close queue">×</button></div>
    <ol class="mu-list" id="queue-list"></ol>
  </aside>

  <div class="mu-mini" id="mini" hidden>
    <a href="#now" class="mu-mini-link" id="mini-return" aria-label="Back to Now playing">
      <span class="mu-mini-txt"><b id="mini-title"></b><small id="mini-sub"></small></span>
    </a>
    <button type="button" class="mu-btn" id="mini-play" aria-label="Play"><svg class="mu-ic"><use href="#i-play"/></svg></button>
    <div class="mu-mini-progress" id="mini-progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="mini-bar"></span></div>
  </div>

</body>
