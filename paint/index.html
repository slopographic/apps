<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slop Shop — Slopographic</title>
  <meta name="description" content="Slop Shop: a layered image editor that runs entirely in your browser. Layers, masks, blend modes, 40+ filters, and real Photoshop PSD open and save. Download it as one offline HTML file.">
  <meta name="theme-color" content="#1d1d1d">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://slopographic.com/paint/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Slopographic">
  <meta property="og:title" content="Slop Shop — Slopographic">
  <meta property="og:description" content="A layered image editor in your browser: masks, blend modes, filters and real PSD files. Nothing leaves your device.">
  <meta property="og:url" content="https://slopographic.com/paint/">
  <meta property="og:image" content="https://slopographic.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="logo" href="../" title="Back to slopographic.com" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
        <span class="logo-word">Slop Shop</span>
      </a>
      <nav class="menubar" id="menubar" aria-label="Menu"></nav>
      <div class="doc-title" id="docTitle">Untitled</div>
      <div class="top-actions">
        <button class="top-btn" id="themeToggle" type="button" title="Switch theme: Pro, Light, Paint ’98" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.8-.7-1.3-1.5-1.1A5 5 0 0 1 13.1 4.5C13.3 3.7 12.8 3 12 3z"/></svg>
        </button>
        <button class="top-btn export" id="exportBtn" type="button" title="Export As… (Alt+Shift+Ctrl+W)">Export</button>
        <button class="top-btn panel-toggle" id="panelToggle" type="button" aria-expanded="false" aria-controls="panels">Layers</button>
      </div>
    </header>
    <div class="options" id="options" role="toolbar" aria-label="Tool options"></div>
    <div class="main">
      <aside class="toolbox" id="toolbox" aria-label="Tools"></aside>
      <div class="viewport" id="viewport">
        <canvas id="view" aria-label="Image canvas"></canvas>
        <div class="drop-hint" aria-hidden="true"><span>Drop images or PSDs to open or add as layers</span></div>
      </div>
      <aside class="panels" id="panels" aria-label="Panels"></aside>
    </div>
    <footer class="status" id="status" aria-label="Status"></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileIn" hidden>
  <noscript><p class="noscript">Slop Shop needs JavaScript to run. Nothing is uploaded: it all runs on your device.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/doc.js"></script>
  <script src="js/psd.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/view.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
