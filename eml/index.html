<body>
  <noscript><p class="em-noscript">Slop EML needs JavaScript. It runs entirely in your browser, and nothing is uploaded.</p></noscript>
  <div class="em-app" id="em-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn sui-primary" id="em-open" title="Open .eml files or a mailbox (.mbox) from this computer (Ctrl+O)">Open</button>
      <button type="button" class="sui-btn" id="em-cmd" aria-label="Commands (search every command)">Commands</button>
    </div>
    <div id="em-drop" class="em-dropstrip"></div>
    <nav class="em-tabs" id="em-tabs" aria-label="Pinned messages" hidden></nav>

    <div class="em-frame-root" id="em-frame">
      <aside class="em-list" id="em-list" aria-label="Messages">
        <div class="em-list-bar">
          <div class="em-list-row">
            <label class="em-all"><input type="checkbox" id="em-check-all" aria-label="Select every message shown"> <span id="em-count">0 messages</span></label>
            <select class="sui-input em-sort" id="em-sort" aria-label="Sort messages"></select>
            <button type="button" class="sui-btn em-list-actions" id="em-list-actions" aria-haspopup="dialog">Actions</button>
          </div>
          <input type="search" class="sui-input em-search" id="em-search" placeholder="Search sender, subject, attachments" aria-label="Search messages">
        </div>
        <ul class="em-rows" id="em-rows" aria-label="Messages"></ul>
        <p class="em-noresults" id="em-noresults" hidden>No message matches the search.</p>
      </aside>

      <main class="em-main" id="em-main">
        <section class="em-empty" id="em-empty">
          <h2 class="em-empty-t">Open an email file to read it.</h2>
          <p class="em-empty-s">Drop .eml files or a mailbox (.mbox) here, or open them from this computer. Nothing is uploaded: the files are read in this page and never leave it.</p>
          <div class="em-empty-b">
            <button type="button" class="sui-btn sui-primary" id="em-open2">Open email files</button>
          </div>
        </section>

        <article class="em-msg" id="em-msg" hidden>
          <div class="em-bar em-phonebar">
            <button type="button" class="sui-btn em-back" id="em-back">‹ Messages (<span id="em-list-n">0</span>)</button>
            <button type="button" class="sui-btn" id="em-actions" aria-haspopup="dialog">Actions</button>
          </div>
          <h2 class="em-subject" id="em-subject"></h2>
          <dl class="em-head" id="em-head"></dl>
          <div class="em-bar">
            <div class="em-seg" id="em-views" role="group" aria-label="Body view" hidden>
              <button type="button" class="sui-btn" id="em-v-html" aria-pressed="true">HTML</button>
              <button type="button" class="sui-btn" id="em-v-text" aria-pressed="false">Plain text</button>
            </div>
            <button type="button" class="sui-btn em-chip" id="em-atts-chip" hidden>0 attachments</button>
          </div>
          <div class="em-notice" id="em-notice" role="status" hidden>
            <p class="em-notice-t" id="em-notice-t"></p>
            <button type="button" class="sui-btn" id="em-cid" aria-pressed="false" hidden>Show embedded images</button>
          </div>
          <div class="em-body" id="em-body"></div>
          <details class="em-warn" id="em-warn" hidden>
            <summary>Some parts could not be read as written</summary>
            <ul id="em-warn-list"></ul>
          </details>
        </article>
      </main>

      <aside class="em-side" id="em-side" aria-label="Actions"></aside>
    </div>
  </div>
