<body>
  <div class="sv-app">
    <header class="sv-top">
      <div class="sv-brand"><a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a><h1>Slop Sheets</h1></div>
      <div class="sv-name" id="sv-name" aria-live="polite"></div>
      <div class="sv-tools" role="toolbar" aria-label="File">
        <button type="button" class="sv-btn sv-primary" id="sv-open" title="Open spreadsheets from this computer (Ctrl+O)">Open</button>
        <button type="button" class="sv-btn" id="sv-export" aria-haspopup="menu" title="Export the rows you see, or all rows">Export</button>
        <button type="button" class="sv-btn" id="sv-hub" title="Send the current sheet to Slop Tables">Open in Slop Table</button>
        <label class="sv-pick">Table style
          <select id="sv-style"></select>
        </label>
        <label class="sv-pick">Colours
          <select id="sv-palette"></select>
        </label>
        <button type="button" class="sv-btn" id="sv-cmd" aria-label="Commands (search every command)">Commands</button>
        <button type="button" class="sv-btn" id="sv-menu" aria-haspopup="menu">Menu</button>
      </div>
    </header>

    <div class="sv-tabs sv-docs" id="sv-docs" role="tablist" aria-label="Open files" hidden></div>
    <div class="sv-tabs sv-sheets" id="sv-sheets" role="tablist" aria-label="Sheets" hidden></div>
    <div id="sv-drop" class="sv-dropstrip"></div>

    <main class="sv-main" id="sv-main">
      <div class="sv-empty" id="sv-empty">
        <p class="sv-empty-t">Open a spreadsheet to browse it.</p>
        <p class="sv-empty-s">Drop an .xlsx, .csv or .tsv file here, or choose one from this computer. Nothing is uploaded. Old .xls files are not supported: save them as .xlsx first.</p>
        <div class="sv-empty-b">
          <button type="button" class="sv-btn sv-primary" id="sv-open2">Open a spreadsheet</button>
        </div>
      </div>
      <section class="sv-view" id="sv-view" aria-label="Sheet" hidden>
        <div class="sv-bar" role="toolbar" aria-label="Sort and filter">
          <span class="sv-status" id="sv-status" role="status" aria-live="polite"></span>
          <button type="button" class="sv-btn sv-mini" id="sv-clear" disabled>Clear sort and filters</button>
        </div>
        <div class="sv-host" id="sv-grid"></div>
      </section>
    </main>
  </div>
