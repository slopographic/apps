    </aside>
    <div class="scrim" id="scrim" hidden></div>

      <div class="bar">

        <div class="bar-tools">
          <select id="kind" class="inp" aria-label="Filter by kind"></select>
          <div class="seg" id="views" role="group" aria-label="View"></div>
          <button type="button" class="tb" id="btnSort" title="Sort (Alt+S)" aria-label="Sort" aria-haspopup="menu"><svg class="ic" viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg></button>
