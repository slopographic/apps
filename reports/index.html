<body>
  <p class="rp-lead">Reports across Contacts, Invoices, Expenses, the ledger and CRM. Read-only: nothing here changes your records.</p>

  <main class="rp-main">
    <section class="rp-bar" aria-label="Report">
      <label for="report">Report</label>
      <select id="report"></select>
      <button id="new" type="button">New report</button>
      <button id="edit" type="button">Edit</button>
      <button id="delete" type="button" hidden>Delete</button>
      <button id="csv" type="button">Export CSV</button>
    </section>
    <p id="data-note" class="rp-note" hidden></p>
    <p id="report-note" class="rp-sub"></p>
    <section id="editor" class="rp-editor" aria-label="Report definition" hidden>
      <label for="json">Report definition (JSON)</label>
      <textarea id="json" spellcheck="false" rows="16"></textarea>
      <p id="err" class="rp-err" role="alert"></p>
      <div class="rp-bar">
        <button id="save" type="button">Save report</button>
        <button id="cancel" type="button">Cancel</button>
      </div>
    </section>
    <section id="results" class="rp-results" aria-live="polite"></section>
  </main>
