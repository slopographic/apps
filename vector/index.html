<!doctype html>
<html lang="en" data-theme="pro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slop Vector — Slopographic</title>
  <meta name="description" content="Slop Vector: a real, fully working Illustrator-style vector editor that runs 100% in your browser. Pen, shapes, layers, gradients, pathfinder, SVG/PDF/PNG export. No uploads, no accounts.">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://slopographic.com/vector/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Slopographic">
  <meta property="og:title" content="Slop Vector — Slopographic">
  <meta property="og:description" content="The illustrator clone nobody asked for: a real in-browser vector editor. Pen tool, live shapes, layers, booleans, PDF export. 100% local.">
  <meta property="og:url" content="https://slopographic.com/vector/">
  <meta property="og:image" content="https://slopographic.com/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    /* Keep a pristine copy of this page when running as the offline single-file build,
       so "Download App" can re-serialise itself without fetching anything. */
    window.__SV_PRISTINE = null;
    window.__SV_THEME0 = document.documentElement.getAttribute('data-theme');
    document.addEventListener('DOMContentLoaded', function () {
      try {
        if (location.protocol === 'file:' || document.querySelector('meta[name="slop-vector-build"]')) {
          var c = document.documentElement.cloneNode(true);
          c.setAttribute('data-theme', window.__SV_THEME0 || 'pro');
          window.__SV_PRISTINE = '<!doctype html>\n' + c.outerHTML;
        }
      } catch (e) { /* ignore */ }
    }, { once: true });
    try { var t = localStorage.getItem('slopvector.theme'); if (t === 'light' || t === 'classic' || t === 'pro') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/slopui.css">
  <link rel="stylesheet" href="vector.css">
</head>
<body>
  <div id="app" class="app">
    <header class="menubar" id="menubar">
      <a class="brand" href="../" title="Slopographic home" aria-label="Slopographic home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/><path class="shine" d="M11.5 20.5a4.5 4.5 0 0 0 3.5 4.4"/></svg>
        <span class="brand-name">Slop Vector</span>
      </a>
      <nav class="menus" id="menus" role="menubar" aria-label="Main menu"></nav>
      <div class="menubar-right">
        <span class="docname" id="docTitle"></span>
        <button type="button" class="iconbtn" id="panelsToggle" title="Show/Hide Panels (Tab)" aria-label="Show or hide panels"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M15 4v16M17.5 8h1.5M17.5 11h1.5"/></svg></button>
        <a class="home-link" href="../" title="Back to slopographic.com"><span class="hl-text">slopographic.com</span> <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <div class="controlbar" id="controlbar" role="toolbar" aria-label="Control bar"></div>
    <div class="main">
      <aside class="toolbar" id="toolbar" aria-label="Tools panel"></aside>
      <section class="center" aria-label="Canvas">
        <div class="doctabs"><div class="doctab active" id="docTab"></div></div>
        <div class="workspace" id="workspace">
          <div class="ruler-corner" id="rulerCorner" title="Double-click to fit artboard"></div>
          <canvas class="ruler ruler-h" id="rulerH" aria-label="Horizontal ruler — drag down to create a guide"></canvas>
          <canvas class="ruler ruler-v" id="rulerV" aria-label="Vertical ruler — drag right to create a guide"></canvas>
          <div class="stage" id="stage" data-tool="select">
            <svg id="docsvg" class="docsvg" xmlns="http://www.w3.org/2000/svg" aria-label="Artwork">
              <g id="vpBack"><rect id="artShadow" x="0" y="0" width="1" height="1"/><rect id="artboard" x="0" y="0" width="1" height="1"/></g>
              <g id="grid"></g>
              <g id="vpArt"></g>
            </svg>
            <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <textarea id="textEditor" class="text-editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Edit text" wrap="off"></textarea>
            <div class="drop-hint" aria-hidden="true"><span>Drop SVG or images to place them</span></div>
          </div>
        </div>
      </section>
      <aside class="dock" id="dock" aria-label="Panels"></aside>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <div id="menuLayer"></div>
  <noscript><p class="noscript">Slop Vector needs JavaScript. It runs entirely in your browser — nothing is uploaded.</p></noscript>
  <script src="geom.js"></script>
  <script src="vector.js"></script>
  <script src="tools.js"></script>
  <script src="io.js"></script>
  <script src="../shared/slopui.js"></script>
  <script src="ui.js"></script>
</body>
</html>
