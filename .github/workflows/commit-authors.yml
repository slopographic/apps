name: Commit authors

on:
  push:
    branches: ['**'] # branch pushes only: a tag points at commits that were checked when their branch was pushed
  pull_request:

# The GITHUB_TOKEN can only read the repository; a job that needs more says so in its own permissions block.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject other authors and co-author trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.sha }}^!" # a new branch: its own commit (the history before it was checked on its branch)
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Checking $RANGE"
          bad=$(git log "$RANGE" --format='%h %an <%ae> | %cn <%ce>' | grep -viE '^[0-9a-f]+ slopographic <340656300\+slopographic@users\.noreply\.github\.com> \| slopographic <340656300\+slopographic@users\.noreply\.github\.com>$' || true)
          trailers=$(git log "$RANGE" --format='%h%n%B' | grep -iE '^(co-authored-by:|[a-z-]+-session:|.*generated with \[)' || true)
          if [ -n "$bad$trailers" ]; then
            echo "::error::Commits by another author or with co-author trailers found"
            echo "$bad"; echo "$trailers"
            exit 1
          fi
          echo "All commit authors OK"
