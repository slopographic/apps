name: Store apps

# The Android app (a Trusted Web Activity, mobile/android) and the iPhone/iPad app (Capacitor around the app's own copy of
# the site, mobile/ios), built on request only: Actions -> Store apps -> Run workflow. Nothing is published unless
# "release" is ticked; the builds are artifacts of the run. mobile/README.md says what each store needs.
# Signing is optional and comes from secrets (never from the repository):
#   Android: ANDROID_KEYSTORE_BASE64 (the upload keystore, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD. Without them: an unsigned release AAB/APK and a debug APK (installable for testing).
#   iOS:     APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (an App Store Connect API key). Without them: an
#            unsigned simulator build (.app, zipped). With them: a signed .ipa (Xcode's cloud signing); with release, it
#            is also uploaded to App Store Connect (TestFlight).
on:
  push:
    branches: [wip/mobile-apps]
    paths: [.github/workflows/mobile.yml]
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, android, ios]
        default: both
      release:
        description: Release (a draft GitHub Release with the signed files, and the iOS build uploaded to TestFlight)
        type: boolean
        default: false

# The GITHUB_TOKEN can only read the repository; the release job asks for more in its own permissions block.
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: The manifest is complete and the asset links file is up to date
        run: node mobile/android/assetlinks.mjs --check
      - name: Generate the project (Bubblewrap, from manifest.webmanifest)
        working-directory: mobile/android
        run: |
          npm ci --no-audit --no-fund
          node generate.mjs --version-code=${{ github.run_number }} --version-name=1.0.${{ github.run_number }}
      - name: Build (AAB for Play, APKs)
        working-directory: mobile/android/build/project
        run: ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease assembleDebug
      - name: Sign with the upload key (when its secrets are set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          out=mobile/android/build/project/app/build/outputs
          mkdir -p dist
          cp "$out/apk/debug/app-debug.apk" dist/app-debug.apk
          if [ -z "$KEYSTORE" ]; then
            echo "No upload key secrets: the release files stay unsigned (Play needs them signed)."
            cp "$out/bundle/release/app-release.aab" dist/app-release-unsigned.aab
            cp "$out/apk/release/app-release-unsigned.apk" dist/app-release-unsigned.apk
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -signedjar dist/app-release.aab "$out/bundle/release/app-release.aab" "$ALIAS"
          "$tools/zipalign" -p 4 "$out/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:STORE_PASS --ks-key-alias "$ALIAS" \
            --key-pass env:KEY_PASS --out dist/app-release.apk "$RUNNER_TEMP/aligned.apk"
          echo "Upload key SHA-256 (for mobile/mobile.json android.fingerprints):"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -alias "$ALIAS" | grep -i 'SHA256:'
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Sizes
        run: ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/
          retention-days: 30

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The app's copy of the site, with the engines it runs (no downloaded code)
        run: node mobile/ios/bundle.mjs
      - name: Generate the Xcode project (Capacitor) and patch it
        working-directory: mobile/ios
        run: |
          npm ci --no-audit --no-fund
          node capacitor.mjs config
          npx cap add ios
          node capacitor.mjs patch
          npx cap sync ios
      - name: Simulator build (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          mkdir -p ../../dist
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/App.app ../../dist/app-simulator.zip
      - name: Signed build (when the App Store Connect key secrets are set)
        working-directory: mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          UPLOAD: ${{ inputs.release }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$TEAM" ]; then echo "No App Store Connect key secrets: simulator build only."; exit 0; fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "$KEY_P8" | base64 -d > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          dest=export; [ "$UPLOAD" = "true" ] && dest=upload
          plutil -create xml1 build/export.plist
          plutil -insert method -string app-store-connect -insert teamID -string "$TEAM" -insert destination -string "$dest" \
            -insert signingStyle -string automatic build/export.plist
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${auth[@]}" archive | tail -n 40
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist build/export.plist "${auth[@]}"
          if ls build/ipa/*.ipa >/dev/null 2>&1; then cp build/ipa/*.ipa ../../dist/; fi
          rm -f "$key"
      - name: Sizes
        run: ls -l dist
      - uses: actions/upload-artifact@v6
        with:
          name: ios
          path: dist/
          retention-days: 30

  release:
    needs: [android, ios]
    if: ${{ always() && inputs.release && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lR dist
          gh release create "apps-${{ github.run_number }}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Store apps ${{ github.run_number }}" --notes "Built by the Store apps workflow (run ${{ github.run_id }})." \
            $(find dist -type f)
