name: Preview of testing

# Every push to the testing branch publishes it to https://slopographic.github.io (the repo
# slopographic/slopographic.github.io, served by GitHub Pages), so a change can be checked live before a milestone merges it
# into main (slopographic.com). The copy leaves out CNAME (the live domain stays with main) and .github (this repo's
# workflows must not run there). Search engines: every page of the copy says noindex, nofollow, and robots.txt lets crawlers
# read that (a robots.txt block alone would hide the tag); the pages' canonical links point at slopographic.com, and
# main's own robots.txt and sitemap are untouched, so the live site is indexed as before. The push uses PREVIEW_TOKEN.
# The SEO pages of the languages besides the root one (/sv/) are not committed: the build writes them here, as the
# production deploy does (.github/workflows/pages.yml; tools/seo/write.mjs --langs), before the noindex pass covers them.
on:
  push:
    branches: [testing]
  workflow_dispatch:

# The GITHUB_TOKEN can only read the repository; a job that needs more says so in its own permissions block.
permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the preview copy
        run: |
          mkdir ../preview
          git archive HEAD | tar -x -C ../preview
          cd ../preview
          node tools/seo/write.mjs --langs
          rm -rf CNAME .github .githooks sitemap*.xml
          printf 'User-agent: *\nAllow: /\n' > robots.txt
          find . -name '*.html' -not -path './tests/*' -print0 | xargs -0 sed -i '0,/<head>/s//<head><meta name="robots" content="noindex, nofollow">/'
          test "$(grep -rl --include='*.html' 'content="noindex, nofollow"' . | grep -v '^./tests/' | wc -l)" -eq "$(find . -name '*.html' -not -path './tests/*' | wc -l)"
          touch .nojekyll
          printf 'Preview of slopographic/apps at %s (%s). The live site is https://slopographic.com.\n' "${GITHUB_SHA::8}" "$(date -u +%FT%TZ)" > PREVIEW.txt
      - name: Publish to slopographic/slopographic.github.io
        env:
          TOKEN: ${{ secrets.PREVIEW_TOKEN }}
        run: |
          cd ../preview
          git init -q -b main
          git config user.name slopographic
          git config user.email 340656300+slopographic@users.noreply.github.com
          git add -A
          git commit -q -m "Preview of slopographic/apps testing at ${GITHUB_SHA::8}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/slopographic/slopographic.github.io.git" main
