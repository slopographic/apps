name: Rules and tests

# The file rules (tools/check-rules.mjs) and the Node tests, on every push and pull request. The same checks run locally in
# the pre-commit and pre-push hooks (.githooks).
on:
  push:
  pull_request:

# A newer push to the same branch stops the run that is still going (the old commit no longer matters).
# The GITHUB_TOKEN can only read the repository; a job that needs more says so in its own permissions block.
permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs in Playwright's image (Chromium, its libraries and git preinstalled): a few Node tests open pages.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Let git work in the checkout (the container runs as root; the workspace is the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every source file has at most 300 lines
        run: node tools/check-rules.mjs --all
      - name: Every changed script has a test that names it
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Checking $RANGE"
          node tools/check-rules.mjs --range "$RANGE"
      - name: Set up the repo as a clone is (identity and hooks; tests/node/attribution.test.mjs checks both)
        run: |
          git config user.name slopographic
          git config user.email 340656300+slopographic@users.noreply.github.com
          npm ci --no-audit --no-fund
      - name: Node tests
        run: node --test tests/node/*.test.mjs tests/seo/*.test.mjs
      - name: Every cdn file answers on jsDelivr (or GitHub when over its limit) with its size (tools/check-cdn.mjs)
        run: node tools/check-cdn.mjs
      # The files the browser pages download (models, wasm: tests/net-urls.txt), kept between runs; filled here when the list
      # changed, so the slices below find them (tests/netcache.mjs).
      - name: Look up the download cache
        id: netcache
        if: hashFiles('tests/net-urls.txt') != ''
        uses: actions/cache@v6
        with:
          path: tests/.cache/net
          key: testnet-${{ hashFiles('tests/net-urls.txt') }}
          lookup-only: true
      - name: Fill the download cache
        if: hashFiles('tests/net-urls.txt') != '' && steps.netcache.outputs.cache-hit != 'true'
        run: node tests/netcache.mjs --fill

  # What the browser jobs run (tools/ci/plan.mjs; the policy is in README.md, "Rules for every change"): testing runs the
  # full suite; main skips it for a merge of a commit that already passed (its tree is the merged parent's), else runs it;
  # wip/* and every other branch run only the test pages their changes need (tools/ci/affected.mjs), never the full suite.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      pages: ${{ steps.plan.outputs.pages }}
      touch: ${{ steps.plan.outputs.touch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Plan the browser tests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_BASE: ${{ github.event.pull_request.base.sha || 'origin/testing' }}
        run: node tools/ci/plan.mjs

  # The browser tests (tests/**/*.test.html), in the slices the plan asks for, run as parallel jobs, 3 pages at a time in
  # each. The slices are balanced by tests/timings.json (refreshed from CI's browser-results artifacts with
  # node tests/results.mjs). The jobs run in Playwright's own image, which has Chromium and its system libraries. Its version
  # must be the one in package-lock.json (tests/node/ci-config.test.mjs checks it). This is CI only: GitHub Pages serves the
  # files as they are.
  browser:
    name: Browser tests ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SLICE: --shard=${{ matrix.shard }}/${{ needs.plan.outputs.count }}${{ needs.plan.outputs.suite == 'changed' && ' --pages-file=plan-pages.txt' || '' }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - name: The pages of the plan
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
        run: echo "$PAGES" > plan-pages.txt
      - name: Does a page of this slice download files?
        id: net
        run: echo "needs=$(node tests/run.mjs $SLICE --skip-node --needs-net)" >> "$GITHUB_OUTPUT"
      - name: Restore the download cache
        if: steps.net.outputs.needs == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: tests/.cache/net
          key: testnet-${{ hashFiles('tests/net-urls.txt') }}
          restore-keys: testnet-
      - name: Browser tests, slice ${{ matrix.shard }} of ${{ needs.plan.outputs.count }}
        run: node tests/run.mjs $SLICE --jobs=3 --skip-node --results=browser-results-${{ matrix.shard }}.json
      # Each page's seconds, test times and downloads: node tests/results.mjs <the artifacts> refreshes tests/timings.json
      # and tests/net-urls.txt.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: browser-results-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore

  # The touch tests: pages marked <meta name="slop-test-touch"> on a touch tablet, with real touches from the runner
  # (tests/touch.mjs). WebKit is Safari's engine as an iPad (iOS: no dblclick on a double tap, no contextmenu on a long
  # press); Chromium is an Android tablet (its own dblclick and contextmenu, which the touch layer must not double).
  # The plan (tools/ci/plan.mjs) decides: every touch page on a full run, else only the touch pages among the changed pages.
  touch:
    name: Touch tests ${{ matrix.engine }}
    needs: plan
    if: ${{ needs.plan.outputs.touch == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      - name: The pages of the plan
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
        run: echo "$PAGES" > plan-pages.txt
      - name: Touch tests in ${{ matrix.engine }}
        run: node tests/run.mjs --touch --browser=${{ matrix.engine }} --jobs=2 --skip-node ${{ needs.plan.outputs.suite == 'changed' && '--pages-file=plan-pages.txt' || '' }}

  # The white-label build (tools/whitelabel; brand/README.md, "White-label builds"), on every push: the made-up sample
  # profiles (brand/profiles/sample*.json) built the way a mirror is, so a change here cannot break a white-label site
  # unnoticed. The rename map's round trip over the whole repository, the build with its leak scan, the build's own Node
  # tests, and browser pages served from the build: a smoke set, and (sample) the contrast sweep in its colours.
  # It runs a fixed set of pages of the build, not this repository's suite; it waits for the plan like every browser job.
  whitelabel:
    name: White-label build ${{ matrix.profile }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        profile: [sample, sample-sv]
    env:
      OUT: ${{ github.workspace }}/../wl-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Let git work in the checkout and in the build (the container runs as root)
        run: git config --global --add safe.directory '*'
      - run: npm ci --no-audit --no-fund
      - name: The rename map comes back over the whole repository (tools/whitelabel/roundtrip.mjs)
        run: node tools/whitelabel/roundtrip.mjs ${{ matrix.profile }}
      - name: Build the profile, with the leak scan (tools/whitelabel/build.mjs)
        run: node tools/whitelabel/build.mjs ${{ matrix.profile }} "$OUT"
      - name: The build as a mirror checkout is (one commit), and its Node tests (less the ones that pin this site's profile)
        run: |
          SKIP=$(node tools/whitelabel/mirror-skip.mjs ${{ matrix.profile }})
          cd "$OUT" && git init -q && git add -A && git -c user.name=mirror -c user.email=mirror@example.invalid commit -qm build
          npm ci --no-audit --no-fund && node --test ${SKIP:+"--test-skip-pattern=$SKIP"} tests/node/*.test.mjs tests/seo/*.test.mjs
      - name: Browser smoke pages, served from the build (the set a mirror runs, tools/whitelabel/mirror-skip.mjs)
        run: |
          node tools/whitelabel/mirror-skip.mjs ${{ matrix.profile }} --smoke > "$OUT/smoke-pages.txt"
          cd "$OUT" && node tests/run.mjs --skip-node --jobs=3 --pages-file=smoke-pages.txt
      - name: The contrast sweep in the profile's colours
        if: matrix.profile == 'sample'
        run: cd "$OUT" && node tests/run.mjs a11y/sweep- --skip-node --jobs=3
