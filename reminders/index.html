<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <a id="rAbout" href="about/">About</a>
      <button type="button" class="tb-btn" id="rCmd" data-cmd="cmd.palette" aria-label="Search commands" title="Search commands (Ctrl+K)">⌘K</button>
    </div>
    <main class="main">
      <span class="local-badge" title="Your reminders stay in this browser. Nothing is uploaded."><span>100% local</span></span>
      <p class="note" id="rNote" role="status"></p>
      <div class="perm">
        <span id="rPerm"></span>
        <button type="button" class="btn" id="rPermBtn">Allow browser notifications</button>
        <label class="check"><input type="checkbox" id="rShow"> Show dismissed</label>
      </div>
      <form class="add" id="rAdd">
        <label class="field"><span>Custom reminder</span><input id="rTitle" type="text" maxlength="200" placeholder="Call the bank back" required></label>
        <label class="field"><span>Date</span><input id="rDate" type="date" aria-label="Date"></label>
        <label class="field"><span>Time</span><input id="rTime" type="time" aria-label="Time"></label>
        <button type="submit" class="btn primary">Add reminder</button>
      </form>
      <div id="rBoot" class="empty" role="status">Opening your reminders…</div>
      <div id="rList"></div>
    </main>
  </div>
