<body>
  <div class="co-bar" id="co-bar"></div>
  <!-- View · Panel (shared/frame): the colour, the picture, the palette and the contrast check in the middle; the colour's
       values, what to generate and the export on the right, with Download palette at the panel's foot -->
  <main class="co-main" id="co-main">
    <section class="co-view" id="co-view" aria-label="Colours">
      <section class="co-hero" id="co-hero" aria-label="Current colour">
        <div class="co-big" id="co-big" role="img" aria-label="The current colour"><span id="co-big-hex"></span></div>
        <ul class="co-values" id="co-values" aria-label="The colour in each format"></ul>
      </section>

      <section class="co-card" aria-labelledby="co-pic-h">
        <div class="co-head"><h2 id="co-pic-h">Pick from a picture</h2>
          <button type="button" class="sui-btn" id="co-pic-open">Open picture…</button>
          <button type="button" class="sui-btn" id="co-screen" hidden>Pick from screen</button></div>
        <div class="co-pic" id="co-pic" hidden>
          <canvas id="co-canvas" class="co-canvas" data-touch-surface tabindex="0" aria-label="The picture. Move over it, or use the arrow keys, to pick a colour; Enter adds it to the palette"></canvas>
          <canvas id="co-loupe" class="co-loupe" width="132" height="132" aria-hidden="true" hidden></canvas>
        </div>
        <p class="co-note" id="co-pic-note" aria-live="polite"></p>
        <div class="co-row" id="co-dominant-wrap" hidden>
          <h3>Main colours of the picture</h3>
          <div class="co-swatches" id="co-dominant" role="list" aria-label="The picture's main colours"></div>
          <button type="button" class="sui-btn" id="co-dominant-add">Add all to the palette</button>
        </div>
        <div class="co-drop" id="co-drop"></div>
      </section>

      <section class="co-card" aria-labelledby="co-pal-h">
        <div class="co-head"><h2 id="co-pal-h">Palette</h2>
          <button type="button" class="sui-btn" id="co-pal-add">Add this colour</button>
          <button type="button" class="sui-btn" id="co-pal-clear">Clear</button></div>
        <div class="co-swatches co-palette" id="co-palette" role="list" aria-label="The palette"></div>
        <p class="co-note" id="co-pal-note"></p>
      </section>

      <section class="co-card" aria-labelledby="co-gen-h">
        <h2 id="co-gen-h">Made from this colour</h2>
        <div class="co-row"><h3 id="co-harm-h"></h3><div class="co-swatches" id="co-harmony" role="list" aria-labelledby="co-harm-h"></div>
          <button type="button" class="sui-btn" id="co-harm-use">Use as the palette</button></div>
        <div class="co-row"><h3 id="co-scale-h"></h3><div class="co-swatches" id="co-scale" role="list" aria-labelledby="co-scale-h"></div>
          <button type="button" class="sui-btn" id="co-scale-use">Use as the palette</button></div>
        <div class="co-row"><h3 id="co-ramp-h">Ramp (50 to 950)</h3><div class="co-swatches" id="co-ramp" role="list" aria-labelledby="co-ramp-h"></div>
          <button type="button" class="sui-btn" id="co-ramp-use">Use as the palette</button></div>
      </section>

      <section class="co-card" aria-labelledby="co-con-h">
        <div class="co-head"><h2 id="co-con-h">Contrast check (WCAG 2)</h2>
          <button type="button" class="sui-btn" id="co-con-swap">Swap</button>
          <button type="button" class="sui-btn" id="co-con-fix">Fix the text colour</button></div>
        <div class="co-con-pair">
          <label class="sf-field"><span class="sf-lab">Text</span><input type="text" id="co-con-fg" spellcheck="false" autocomplete="off"></label>
          <label class="sf-field"><span class="sf-lab">Background</span><input type="text" id="co-con-bg" spellcheck="false" autocomplete="off"></label>
        </div>
        <div class="co-sample" id="co-sample" data-contrast-skip><p class="co-sample-big">Large text, 24 px</p><p>Normal text reads like this paragraph, at 16 px.</p></div>
        <p class="co-ratio"><output id="co-ratio" aria-live="polite"></output></p>
        <ul class="co-verdicts" id="co-verdicts" aria-label="WCAG levels"></ul>
      </section>
    </section>

    <aside class="co-panel" id="co-panel" aria-label="Colour settings"></aside>
  </main>
