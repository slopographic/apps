<!doctype html>
<html lang="en">
<head>
  <script src="../../shared/theme/theme.js" data-app="aitools" data-src="shared/theme/theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech to text · Slop AI Tools</title>
  <meta name="description" content="Transcribe audio or the audio of a video with Whisper tiny, on your device. Timestamps, .srt and .txt export.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aitools.css">
</head>
<body>
  <div class="ai-tool">
    <div class="ai-bar"><a class="ai-btn" href="../">← AI Tools</a><h1>Speech to text</h1></div>
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop">Drop an audio or video file here, or <label><u>choose a file</u><input id="file" type="file" accept="audio/*,video/*" hidden></label><br><span class="ai-meta">Up to 2 hours. Long files are read in 30-second windows.</span></div>
      <div class="ai-grid2">
        <div class="ai-field"><label for="lang">Spoken language</label>
          <select id="lang">
            <option value="auto">Detect</option><option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option>
            <option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="nl">Dutch</option>
            <option value="ru">Russian</option><option value="zh">Chinese</option><option value="ja">Japanese</option><option value="ko">Korean</option>
          </select></div>
        <div class="ai-field"><span class="ai-meta" id="fileName"></span></div>
      </div>
      <div><button id="run" class="ai-pri" type="button" disabled>Transcribe</button></div>
      <progress id="prog" class="ai-progress" value="0" max="1" hidden></progress>
      <p id="msg" class="ai-meta" role="status"></p>
      <textarea id="out" class="ai-out" aria-label="Transcript" placeholder="The transcript appears here, with timestamps in the .srt file."></textarea>
      <div class="ai-act">
        <button id="srt" type="button" disabled>Download .srt</button>
        <button id="txt" type="button" disabled>Download .txt</button>
      </div>
    </section>
  </div>
  <script src="../model-registry.js"></script>
  <script src="../../shared/firstrun/notice.js"></script>
<script src="../models.js"></script>
  <script src="../support.js"></script>
  <script src="../get-more.js"></script>
  <script src="../common.js"></script>
  <script src="speech.js"></script>
</body>
</html>
