<!doctype html>
<html lang="en">
<head>
  <script src="../../shared/theme/theme.js" data-app="aitools" data-src="shared/theme/theme.js"></script>
  <link rel="expect" href="#slop-built" blocking="render">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR · Slop AI Tools</title>
  <meta name="description" content="Read text from an image or a scanned PDF page, on your device. Copy it, download .txt or send it to Slop Docs.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aitools.css">
  <link rel="stylesheet" href="../../shared/slopui.css">
  <link rel="stylesheet" href="../../shared/models/chooser.css">
</head>
<body>
  <header class="ai-top">
    <a class="brand" href="../../" title="Slopographic home" aria-label="Slopographic home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a>
    <a class="ai-crumb" href="../">AI Tools</a><span class="ai-sep" aria-hidden="true">/</span><h1>OCR</h1>
  </header>
  <div class="ai-tool">
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop" tabindex="0">Drop an image or a PDF here, or <label><u>choose a file</u><input id="file" type="file" accept="image/*,application/pdf" hidden></label></div>
      <div class="ai-field"><label for="page">PDF page (PDFs only)</label><input id="page" type="number" min="1" value="1"></div>
      <p id="fileName" class="ai-meta"></p>
      <div><button id="run" class="ai-pri" type="button" disabled>Read text</button> <button id="lang" type="button">Language and model</button></div>
      <progress id="prog" class="ai-progress" value="0" max="1" hidden></progress>
      <p id="msg" class="ai-meta" role="status"></p>
      <div id="suggest"></div>
      <textarea id="out" class="ai-out" aria-label="Recognised text" placeholder="The text appears here. You can edit it before you copy or save it."></textarea>
      <div class="ai-act">
        <button id="copy" type="button" disabled>Copy</button>
        <button id="dl" type="button" disabled>Download .txt</button>
        <button id="docs" type="button" disabled>Send to Slop Docs</button>
      </div>
    </section>
  </div>
  <script src="../../shared/slopui.js"></script>
  <script src="../../shared/models/catalog.js"></script>
  <script src="../ocr-models.js"></script>
  <script src="../model-registry.js"></script>
  <script src="../download.js"></script>
  <script src="../../shared/firstrun/notice.js"></script>
<script src="../models.js"></script>
  <script src="../support.js"></script>
  <script src="../get-more.js"></script>
  <script src="../common.js"></script>
  <script src="../../shared/apps.js"></script>
  <script src="../../shared/hub.js"></script>
  <script src="../../shared/intake/outtake.js"></script>
  <script src="../../shared/ops/entry.js"></script>
  <script src="ocr.js"></script>
  <script src="../../shell/shell.js"></script>
<i id="slop-built" hidden></i>
</body>
</html>
