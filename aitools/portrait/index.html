<!doctype html>
<html lang="en">
<head>
  <script src="../../shared/theme/theme.js" data-app="aitools" data-src="shared/theme/theme.js"></script>
  <link rel="expect" href="#slop-built" blocking="render">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portrait blur · Slop AI Tools</title>
  <meta name="description" content="Blur the background of a portrait with the segmentation model Slop Isolate uses. Runs on your device, with a strength slider.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aitools.css">
</head>
<body>
  <header class="ai-top">
    <a class="brand" href="../../" title="Slopographic home" aria-label="Slopographic home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a>
    <a class="ai-crumb" href="../">AI Tools</a><span class="ai-sep" aria-hidden="true">/</span><h1>Portrait blur</h1>
  </header>
  <div class="ai-tool">
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop">Drop a portrait here, or <label><u>choose a file</u><input id="file" type="file" accept="image/*" hidden></label><br><span class="ai-meta">The person stays sharp; the background blurs. The model is the one Slop Isolate uses (bundled, no download).</span></div>
      <div class="ai-field"><label for="strength">Blur strength: <span id="sv">50</span></label><input id="strength" type="range" min="0" max="100" value="50" disabled></div>
      <p id="msg" class="ai-meta" role="status"></p>
      <div class="ai-panel"><canvas id="view" class="ai-img" aria-label="Preview"></canvas></div>
      <div class="ai-act"><button id="dl" type="button" disabled>Download PNG</button></div>
    </section>
  </div>
  <script src="../model-registry.js"></script>
  <script src="../../shared/firstrun/notice.js"></script>
<script src="../models.js"></script>
  <script src="../support.js"></script>
  <script src="../get-more.js"></script>
  <script src="../common.js"></script>
  <script src="../../shared/cutout/pipeline.js"></script>
  <script src="../../shared/cutout/models.js"></script>
  <script src="../../shared/cutout/cutout.js"></script>
  <script src="portrait.js"></script>
  <script src="../../shell/shell.js"></script>
<i id="slop-built" hidden></i>
</body>
</html>
