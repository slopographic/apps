<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denoise · Slop AI Tools</title>
  <meta name="description" content="Remove speckle and grain from a photo with median and bilateral filters. Compare before and after. Nothing uploaded.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aitools.css">
</head>
<body>
  <div class="ai-tool">
    <div class="ai-bar"><a class="ai-btn" href="../">← AI Tools</a><h1>Denoise</h1></div>
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop">Drop a photo here, or <label><u>choose a file</u><input id="file" type="file" accept="image/*" hidden></label><br><span class="ai-meta">Classic filters, no model. Large photos are reduced to 2048 px for the preview and the download.</span></div>
      <div class="ai-grid2">
        <div class="ai-field"><label for="mode">Filter</label>
          <select id="mode"><option value="both">Median, then bilateral</option><option value="median">Median (speckle and dust)</option><option value="bilateral">Bilateral (grain, keeps edges)</option></select></div>
        <div class="ai-field"><label for="strength">Strength: <span id="sv">50</span></label><input id="strength" type="range" min="0" max="100" value="50"></div>
      </div>
      <div><button id="run" class="ai-pri" type="button" disabled>Apply</button> <span id="msg" class="ai-meta" role="status"></span></div>
      <div id="compare" class="ai-panel" hidden>
        <div class="ai-cmp" id="cmp">
          <canvas id="before" class="ai-img"></canvas>
          <canvas id="after" class="ai-img"></canvas>
        </div>
        <div class="ai-field"><label for="split">Before and after. Drag to compare.</label><input id="split" type="range" min="0" max="100" value="50"></div>
      </div>
      <div class="ai-act"><button id="dl" type="button" disabled>Download PNG</button></div>
    </section>
  </div>
  <style>.ai-cmp{position:relative}.ai-cmp #after{position:absolute;left:0;top:0;width:100%;height:auto;clip-path:inset(0 50% 0 0)}</style>
  <script src="../model-registry.js"></script>
  <script src="../support.js"></script>
  <script src="../common.js"></script>
  <script src="filters.js"></script>
  <script src="denoise.js"></script>
</body>
</html>
